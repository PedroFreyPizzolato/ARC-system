<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARC V2 — PAINEL DO MESTRE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --blue: #00d4ff;
      --purple: #7c3aed;
      --purple-b: #a855f7;
      --gold: #f59e0b;
      --red: #ef4444;
      --green: #10b981;
      --orange: #f97316;
      --pink: #ec4899;
      --teal: #14b8a6;
      --bg: #020408;
      --bd: rgba(0, 212, 255, 0.15);
      --bd-b: rgba(0, 212, 255, 0.4);
      --txt: #e0f7ff;
      --txt-d: rgba(224, 247, 255, 0.45);
      --txt-lbl: rgba(0, 212, 255, 0.7);
      --fs: 20px;
      --fs-sm: 18px;
      --fs-xs: 14px;
      --hh: 52px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--txt);
      font-family: 'Rajdhani', sans-serif;
      font-size: var(--fs)
    }

    input,
    select,
    textarea,
    button {
      font-family: 'Rajdhani', sans-serif;
      font-size: var(--fs)
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: linear-gradient(rgba(0, 212, 255, 0.018) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.018) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none
    }

    .bg-glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 60% 40% at 10% 10%, rgba(124, 58, 237, 0.06) 0%, transparent 60%), radial-gradient(ellipse 50% 50% at 90% 90%, rgba(239, 68, 68, 0.04) 0%, transparent 60%)
    }

    .scanline {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 212, 255, 0.005) 2px, rgba(0, 212, 255, 0.005) 4px)
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--hh);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid rgba(239, 68, 68, 0.2);
      background: rgba(2, 4, 8, 0.96);
      backdrop-filter: blur(12px)
    }

    .hdr-left {
      display: flex;
      align-items: center;
      gap: 14px
    }

    .hdr-logo {
      font-family: 'Orbitron', monospace;
      font-size: 22px;
      font-weight: 900;
      color: var(--red);
      letter-spacing: 4px;
      text-shadow: 0 0 18px rgba(239, 68, 68, 0.5)
    }

    .hdr-tag {
      padding: 4px 12px;
      border: 1px solid rgba(0, 212, 255, 0.25);
      color: var(--blue);
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      letter-spacing: 2px;
      background: rgba(0, 212, 255, 0.04)
    }

    .hdr-online {
      display: flex;
      align-items: center;
      gap: 5px
    }

    .hdr-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s infinite
    }

    .hdr-online-txt {
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      color: var(--green);
      letter-spacing: 2px
    }

    .hdr-right {
      display: flex;
      gap: 7px;
      align-items: center
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .4
      }
    }

    .app-shell {
      position: fixed;
      top: var(--hh);
      left: 0;
      right: 0;
      bottom: 38px;
      z-index: 1;
      display: flex;
      overflow: hidden
    }

    .icon-bar {
      width: 44px;
      flex-shrink: 0;
      background: rgba(2, 4, 8, 0.85);
      border-right: 1px solid rgba(239, 68, 68, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 0;
      gap: 2px
    }

    .ic-btn {
      width: 40px;
      height: 46px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--txt-d);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: all .15s
    }

    .ic-btn:hover {
      color: var(--txt);
      border-color: rgba(0, 212, 255, .18);
      background: rgba(0, 212, 255, .03)
    }

    .ic-btn.on {
      color: var(--red);
      border-color: rgba(239, 68, 68, .32);
      background: rgba(239, 68, 68, .06)
    }

    .ic-sym {
      font-size: 19px;
      line-height: 1
    }

    .ic-lbl {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 1px
    }

    .list-panel {
      width: 268px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--bd);
      background: rgba(2, 4, 8, 0.55);
      overflow: hidden
    }

    .list-panel.gone {
      display: none
    }

    .lp-hdr {
      padding: 9px 12px 7px;
      border-bottom: 1px solid var(--bd);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0
    }

    .lp-title {
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--blue)
    }

    .lp-count {
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      color: var(--txt-d)
    }

    .lp-search-wrap {
      padding: 7px 7px 3px;
      flex-shrink: 0
    }

    .lp-search {
      width: 100%;
      background: rgba(0, 212, 255, 0.04);
      border: 1px solid var(--bd);
      color: var(--txt);
      padding: 5px 9px;
      font-size: 15px;
      font-family: 'Share Tech Mono', monospace;
      outline: none;
      letter-spacing: .5px
    }

    .lp-search:focus {
      border-color: var(--blue)
    }

    .lp-search::placeholder {
      color: var(--txt-d)
    }

    .lp-items {
      flex: 1;
      overflow-y: auto;
      padding: 3px 7px
    }

    .lp-items::-webkit-scrollbar {
      width: 3px
    }

    .lp-items::-webkit-scrollbar-thumb {
      background: rgba(0, 212, 255, .12)
    }

    .lp-item {
      padding: 8px 9px;
      border: 1px solid transparent;
      margin-bottom: 3px;
      cursor: pointer;
      transition: all .12s
    }

    .lp-item:hover {
      background: rgba(0, 212, 255, .04);
      border-color: var(--bd)
    }

    .lp-item.on {
      background: rgba(239, 68, 68, .06);
      border-color: rgba(239, 68, 68, .28)
    }

    .lp-item-name {
      font-weight: 600;
      font-size: 17px;
      color: var(--txt);
      line-height: 1.2;
      margin-bottom: 3px
    }

    .lp-item-sub {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-wrap: wrap
    }

    .lp-add {
      margin: 6px 7px;
      padding: 8px;
      background: transparent;
      border: 1px dashed rgba(239, 68, 68, .18);
      color: rgba(239, 68, 68, .4);
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all .18s;
      text-align: center;
      flex-shrink: 0
    }

    .lp-add:hover {
      border-color: var(--red);
      color: var(--red)
    }

    .tg-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 9px;
      border-bottom: 1px solid rgba(0, 212, 255, .06)
    }

    .tg-lbl {
      font-family: 'Orbitron', monospace;
      font-size: 12px;
      letter-spacing: 2px
    }

    .tg-add {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, .12);
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      padding: 2px 7px;
      cursor: pointer;
      transition: all .12s;
      letter-spacing: 1px;
      color: var(--txt-d)
    }

    .tg-add:hover {
      border-color: var(--blue);
      color: var(--blue)
    }

    .main {
      flex: 1;
      overflow-y: auto;
      min-width: 0
    }

    .main::-webkit-scrollbar {
      width: 4px
    }

    .main::-webkit-scrollbar-thumb {
      background: rgba(0, 212, 255, .1)
    }

    .dw {
      padding: 20px 24px
    }

    .empty-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 10px
    }

    .em-icon {
      font-size: 44px;
      color: rgba(0, 212, 255, .08)
    }

    .em-text {
      font-family: 'Orbitron', monospace;
      font-size: 15px;
      letter-spacing: 3px;
      color: rgba(0, 212, 255, .25)
    }

    .em-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      color: var(--txt-d);
      letter-spacing: 1px
    }

    .d-hdr {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 5px
    }

    .d-title {
      font-family: 'Orbitron', monospace;
      font-size: 24px;
      font-weight: 700;
      color: var(--txt)
    }

    .d-badges {
      display: flex;
      gap: 5px;
      margin-top: 5px;
      flex-wrap: wrap
    }

    .d-sep {
      height: 1px;
      background: linear-gradient(90deg, rgba(239, 68, 68, .45), rgba(0, 212, 255, .2), transparent);
      margin: 12px 0
    }

    .d-acts {
      display: flex;
      gap: 7px;
      flex-shrink: 0;
      align-items: flex-start
    }

    .sb {
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--red);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      margin-top: 18px
    }

    .sb::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(239, 68, 68, .35), transparent)
    }

    .sb:first-child,
    .sb.top {
      margin-top: 0
    }

    .sb.blue {
      color: var(--blue)
    }

    .sb.blue::after {
      background: linear-gradient(90deg, rgba(0, 212, 255, .35), transparent)
    }

    .sb.gold {
      color: var(--gold)
    }

    .sb.gold::after {
      background: linear-gradient(90deg, rgba(245, 158, 11, .35), transparent)
    }

    .sb.purple {
      color: var(--purple-b)
    }

    .sb.purple::after {
      background: linear-gradient(90deg, rgba(168, 85, 247, .35), transparent)
    }

    .sb.green {
      color: var(--green)
    }

    .sb.green::after {
      background: linear-gradient(90deg, rgba(16, 185, 129, .35), transparent)
    }

    .sb.pink {
      color: var(--pink)
    }

    .sb.pink::after {
      background: linear-gradient(90deg, rgba(236, 72, 153, .35), transparent)
    }

    .sb.teal {
      color: var(--teal)
    }

    .sb.teal::after {
      background: linear-gradient(90deg, rgba(20, 184, 166, .35), transparent)
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .lbl {
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      color: var(--txt-lbl);
      letter-spacing: 1.5px
    }

    .inp {
      background: rgba(0, 212, 255, 0.04);
      border: 1px solid var(--bd);
      color: var(--txt);
      font-size: var(--fs);
      padding: 6px 10px;
      outline: none;
      transition: all .18s;
      width: 100%
    }

    .inp:focus {
      border-color: var(--blue);
      box-shadow: 0 0 8px rgba(0, 212, 255, .1);
      background: rgba(0, 212, 255, .06)
    }

    select.inp option {
      background: #0a0f1a;
      color: var(--txt)
    }

    textarea.inp {
      resize: vertical;
      min-height: 55px;
      line-height: 1.6
    }

    .g2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px
    }

    .g3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 11px
    }

    .g4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px
    }

    .mt4 {
      margin-top: 4px
    }

    .mt8 {
      margin-top: 8px
    }

    .mt12 {
      margin-top: 12px
    }

    .mt16 {
      margin-top: 16px
    }

    .mb4 {
      margin-bottom: 4px
    }

    .mb8 {
      margin-bottom: 8px
    }

    .mb12 {
      margin-bottom: 12px
    }

    .attr-ctrl {
      display: flex;
      align-items: center;
      gap: 5px
    }

    .attr-col {
      padding: 8px 10px;
      background: rgba(0, 212, 255, .02);
      border: 1px solid var(--bd)
    }

    .c-btn {
      width: 24px;
      height: 24px;
      background: transparent;
      border: 1px solid var(--bd);
      color: var(--txt-d);
      cursor: pointer;
      font-size: 19px;
      line-height: 1;
      transition: all .12s;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .c-btn:hover {
      border-color: var(--blue);
      color: var(--blue);
      background: rgba(0, 212, 255, .07)
    }

    .c-val {
      font-family: 'Orbitron', monospace;
      font-size: 21px;
      font-weight: 700;
      min-width: 26px;
      text-align: center
    }

    .c-bon {
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      color: var(--txt-d);
      min-width: 28px
    }

    .bar-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .bar-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .bar-lbl {
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      color: var(--txt-lbl);
      letter-spacing: 1px
    }

    .bar-inps {
      display: flex;
      gap: 4px;
      align-items: center
    }

    .bar-inp {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--bd-b);
      color: var(--txt);
      font-family: 'Orbitron', monospace;
      font-size: 17px;
      width: 48px;
      text-align: center;
      outline: none;
      padding: 1px 3px
    }

    .bar-sep {
      color: var(--txt-d);
      font-size: 15px
    }

    .bar-track {
      height: 5px;
      background: rgba(255, 255, 255, .05);
      border-radius: 3px;
      overflow: hidden
    }

    .bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width .4s
    }

    .hp-f {
      background: linear-gradient(90deg, #dc2626, #ef4444);
      box-shadow: 0 0 5px rgba(239, 68, 68, .35)
    }

    .sta-f {
      background: linear-gradient(90deg, #1d4ed8, #3b82f6);
      box-shadow: 0 0 5px rgba(59, 130, 246, .35)
    }

    .san-f {
      background: linear-gradient(90deg, #7c3aed, #a855f7);
      box-shadow: 0 0 5px rgba(168, 85, 247, .35)
    }

    .coe-f {
      background: linear-gradient(90deg, #f97316, #f59e0b);
      box-shadow: 0 0 5px rgba(245, 158, 11, .35)
    }

    .computed {
      background: rgba(0, 212, 255, 0.06);
      border: 1px solid var(--bd);
      color: var(--blue);
      font-family: 'Orbitron', monospace;
      font-size: 22px;
      padding: 6px 10px;
      text-align: center;
      letter-spacing: 2px
    }

    .sk-card {
      background: rgba(0, 212, 255, .02);
      border: 1px solid var(--bd);
      padding: 9px 11px;
      margin-bottom: 5px;
      transition: border-color .12s
    }

    .sk-card:hover {
      border-color: rgba(0, 212, 255, .22)
    }

    .sk-hdr {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 5px
    }

    .sk-ni {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--bd);
      color: var(--txt);
      font-size: var(--fs);
      font-weight: 700;
      outline: none;
      padding: 2px
    }

    .sk-ni:focus {
      border-color: var(--blue)
    }

    .sk-meta {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-shrink: 0
    }

    .act-sel {
      background: rgba(0, 212, 255, .05);
      border: 1px solid var(--bd);
      color: var(--blue);
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      padding: 2px 5px;
      outline: none;
      cursor: pointer
    }

    .act-sel option {
      background: #0a0f1a;
      color: var(--txt)
    }

    .cost-i {
      background: transparent;
      border: 1px solid rgba(245, 158, 11, .3);
      color: var(--gold);
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      padding: 2px 6px;
      outline: none;
      width: 58px;
      text-align: center
    }

    .trow {
      display: grid;
      gap: 5px;
      align-items: center;
      padding: 4px 0;
      border-bottom: 1px solid rgba(0, 212, 255, .04)
    }

    .thdr {
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      color: var(--txt-d);
      letter-spacing: 1px;
      padding: 3px 0;
      border-bottom: 1px solid var(--bd)
    }

    .wi {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(0, 212, 255, .12);
      color: var(--txt);
      font-size: var(--fs-sm);
      padding: 2px 3px;
      outline: none;
      width: 100%;
      transition: border-color .12s
    }

    .wi:focus {
      border-color: var(--blue)
    }

    select.wi option {
      background: #0a0f1a;
      color: var(--txt)
    }

    .wrem {
      background: transparent;
      border: none;
      color: rgba(239, 68, 68, .32);
      cursor: pointer;
      font-size: 17px;
      transition: color .12s;
      padding: 0 2px
    }

    .wrem:hover {
      color: var(--red)
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 3px
    }

    .chip {
      padding: 2px 7px;
      border: 1px solid var(--bd);
      background: transparent;
      color: var(--txt-d);
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      letter-spacing: .5px;
      cursor: pointer;
      transition: all .12s
    }

    .chip:hover {
      border-color: rgba(0, 212, 255, .35);
      color: var(--txt)
    }

    .chip.neg-on {
      border-color: var(--red);
      color: var(--red);
      background: rgba(239, 68, 68, .07)
    }

    .chip.pos-on {
      border-color: var(--green);
      color: var(--green);
      background: rgba(16, 185, 129, .07)
    }

    .bdg {
      display: inline-block;
      padding: 2px 7px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      letter-spacing: .5px;
      border: 1px solid
    }

    .bdg-blue {
      border-color: var(--blue);
      color: var(--blue);
      background: rgba(0, 212, 255, .06)
    }

    .bdg-red {
      border-color: var(--red);
      color: var(--red);
      background: rgba(239, 68, 68, .06)
    }

    .bdg-gold {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(245, 158, 11, .06)
    }

    .bdg-purple {
      border-color: var(--purple-b);
      color: var(--purple-b);
      background: rgba(168, 85, 247, .06)
    }

    .bdg-green {
      border-color: var(--green);
      color: var(--green);
      background: rgba(16, 185, 129, .06)
    }

    .bdg-pink {
      border-color: var(--pink);
      color: var(--pink);
      background: rgba(236, 72, 153, .06)
    }

    .bdg-teal {
      border-color: var(--teal);
      color: var(--teal);
      background: rgba(20, 184, 166, .06)
    }

    .btn {
      padding: 6px 14px;
      background: transparent;
      border: 1px solid;
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all .15s;
      clip-path: polygon(5px 0, 100% 0, calc(100% - 5px) 100%, 0 100%)
    }

    .btn-red {
      border-color: var(--red);
      color: var(--red)
    }

    .btn-red:hover {
      background: rgba(239, 68, 68, .1)
    }

    .btn-blue {
      border-color: var(--blue);
      color: var(--blue)
    }

    .btn-blue:hover {
      background: rgba(0, 212, 255, .1)
    }

    .btn-gold {
      border-color: var(--gold);
      color: var(--gold)
    }

          onchange="importData(event)" style="display:none"></label>

  <script>

    const SECS = [{ id: 'combat', sym: '⚔', lbl: 'CMB' }, { id: 'npc', sym: '◈', lbl: 'NPC' }, { id: 'conceito', sym: '✦', lbl: 'CONC' }, { id: 'artefato', sym: '◆', lbl: 'ART' }, { id: 'armas', sym: '⌖', lbl: 'ARM' }, { id: 'jogadores', sym: '◉', lbl: 'JOG' }, { id: 'mundo', sym: '⊕', lbl: 'MND' }, { id: 'notas', sym: '✎', lbl: 'NOTAS' }];
    const NO_LIST = ['combat', 'npc', 'mundo'];
    const WCATS = ['Arma Branca', 'Arma de Fogo', 'Energia', 'Explosivo', 'Improvisada', 'Pesada', 'Arremesso'];
    const WTYPES = ['Normal', 'Verdadeiro', 'Absoluto'];

    const SPOS = ['Fortificado', 'Acelerado', 'Focado', 'Imparável', 'Blindado', 'Energizado', 'Fortalecido', 'Protegido'];
    const NATS = ['Brutamontes', 'Guerreiro', 'Atleta', 'Velocista'];
    const VIRTUES = ['Diligência', 'Generosidade', 'Temperança', 'Paciência', 'Castidade', 'Caridade', 'Humildade'];
    const SINS = ['Preguiça', 'Avareza', 'Gula', 'Ira', 'Luxúria', 'Inveja', 'Soberba'];
    const TCONC = ['Primordial', 'Virtude', 'Pecado', 'Evoluído', 'Primitivo', 'Outro'];
    const TIERS = ['divino', 'anciao', 'mitico', 'lendario'];
    const TLBL = { divino: 'DIVINOS', anciao: 'ANCIÕES', mitico: 'MÍTICOS', lendario: 'LENDÁRIOS' };
    const TCOL = { divino: 'gold', anciao: 'pink', mitico: 'purple', lendario: 'teal' };
    const TBDG = { divino: 'bdg-gold', anciao: 'bdg-pink', mitico: 'bdg-purple', lendario: 'bdg-teal' };

    const UI = { section: 'combat', npcId: null, cId: null, artId: null, artTier: 'divino', sessaoId: null, geral: false, playerOpen: {}, playerId: null, armCat: 'arma', armId: null, armPicker: null };
    let S = { round: 1, cur: 0, combatants: [], combatNotes: '', npcs: [], conceitos: [], artefatos: { divino: [], anciao: [], mitico: [], lendario: [] }, players: [], faccoes: [], locais: [], secretNotes: '', sessoes: [], campaignNotes: '', armaLib: { armas: [], implantes: [] } };

    function uid() { return Date.now() + Math.floor(Math.random() * 9999) }
    function esc(s) { if (s === null || s === undefined) return ''; return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') }
    function bon(v) { const b = Math.floor((v || 0) / 2); return (b >= 0 ? '+' : '') + b }
    function pct(c, m) { return m > 0 ? Math.max(0, Math.min(100, (c / m) * 100)) : 0 }
    function gv(id) { const e = document.getElementById(id); return e ? e.value : '' }
    function st(id, v) { const e = document.getElementById(id); if (e) e.textContent = v }
    function sw(id, w) { const e = document.getElementById(id); if (e) e.style.width = w + '%' }
    function findNPC(id) { return S.npcs.find(x => x.id === id) }
    function findC(id) { return S.conceitos.find(x => x.id === id) }
    function findArt(tier, id) { return (S.artefatos[tier] || []).find(x => x.id === id) }
    function findP(id) { return S.players.find(x => x.id === id) }
    function findSessao(id) { return S.sessoes.find(x => x.id === id) }

    function saveData() {
      collectState(); localStorage.setItem('arc_gm_v2', JSON.stringify(S));
      const b = document.getElementById('saveBtn');
      b.textContent = '[ SALVO ✓ ]'; b.classList.add('btn-saved');
      setTimeout(() => { b.textContent = '[ SALVAR ]'; b.classList.remove('btn-saved') }, 2000);
    }
    function exportData() {
      collectState();
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob); const a = document.createElement('a');
      a.href = url; a.download = 'arc_gm_save.json'; document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    }
    function importData(e) {
      const file = e.target.files[0]; if (!file) return;
      const r = new FileReader();
      r.onload = ev => { try { S = { ...S, ...JSON.parse(ev.target.result) }; localStorage.setItem('arc_gm_v2', JSON.stringify(S)); renderApp(); } catch (err) { console.error('Erro ao importar.', err); } e.target.value = ''; };
      r.readAsText(file);
    }
    function collectState() {
      const cn = document.getElementById('combatNotesTA'); if (cn) S.combatNotes = cn.value;
      const sn = document.getElementById('secretNotesTA'); if (sn) S.secretNotes = sn.value;
      const gn = document.getElementById('campaignNotesTA'); if (gn) S.campaignNotes = gn.value;
    }
    let _ast;
    function autosave() { clearTimeout(_ast); _ast = setTimeout(() => { localStorage.setItem('arc_gm_v2', JSON.stringify(S)) }, 500) }

    function init() {
      const sv = localStorage.getItem('arc_gm_v2');
      if (sv) { try { S = { ...S, ...JSON.parse(sv) } } catch (e) { } }
      if (!S.armaLib) S.armaLib = { armas: [], implantes: [] };
      if (!S.armaLib.armas) S.armaLib.armas = [];
      if (!S.armaLib.implantes) S.armaLib.implantes = [];
      if (!Array.isArray(S.catalogNpcs)) S.catalogNpcs = [];
      renderApp();
    }
    function setSection(name) {
      UI.section = name;
      if (name === 'npc' && !UI.npcId && S.npcs.length > 0) UI.npcId = S.npcs[0].id;
      if (name === 'conceito' && !UI.cId && S.conceitos.length > 0) UI.cId = S.conceitos[0].id;
      if (name === 'jogadores' && !UI.playerId && S.players.length > 0) UI.playerId = S.players[0].id;
      if (name === 'notas' && !UI.sessaoId && S.sessoes.length > 0) UI.sessaoId = S.sessoes[0].id;
      if (name === 'armas' && !UI.armId) {
        if (S.armaLib.armas.length > 0) { UI.armCat = 'arma'; UI.armId = S.armaLib.armas[0].id; }
        else if (S.armaLib.implantes.length > 0) { UI.armCat = 'implante'; UI.armId = S.armaLib.implantes[0].id; }
      }
      renderApp();
    }
    function selNPC(id) { UI.npcId = id; renderLP(); renderMain() }
    function selC(id) { UI.cId = id; renderLP(); renderMain() }
    function selArt(tier, id) { UI.artTier = tier; UI.artId = id; renderLP(); renderMain() }
    function selPlayer(id) { UI.playerId = id; renderLP(); renderMain() }
    function selSessao(id) { UI.sessaoId = id; UI.geral = false; renderLP(); renderMain() }
    function showGeral() { UI.geral = true; UI.sessaoId = null; renderLP(); renderMain() }
    function selArm(cat, id) { UI.armCat = cat; UI.armId = id; renderLP(); renderMain() }
    function findArma(id) { return (S.armaLib.armas || []).find(x => x.id === id) }
    function findImp(id) { return (S.armaLib.implantes || []).find(x => x.id === id) }

    function renderApp() { renderIcons(); renderLP(); renderMain() }
    function renderIcons() {
      const b = document.getElementById('iconBar'); if (!b) return;
      b.innerHTML = SECS.map(s => `<button class="ic-btn ${UI.section === s.id ? 'on' : ''}" onclick="setSection('${s.id}')"><span class="ic-sym">${s.sym}</span><span class="ic-lbl">${s.lbl}</span></button>`).join('');
    }
    function renderLP() {
      const p = document.getElementById('listPanel'); if (!p) return;
      if (NO_LIST.includes(UI.section)) { p.classList.add('gone'); return }
      p.classList.remove('gone');
      if (UI.section === 'npc') p.innerHTML = lpNPC();
      else if (UI.section === 'conceito') p.innerHTML = lpConceito();
      else if (UI.section === 'artefato') p.innerHTML = lpArtefato();
      else if (UI.section === 'jogadores') p.innerHTML = lpJogadores();
      else if (UI.section === 'armas') p.innerHTML = lpArmas();
      else if (UI.section === 'notas') p.innerHTML = lpNotas();
      else p.innerHTML = '';
    }
    function renderMain() {
      const m = document.getElementById('mainContent'); if (!m) return;
      if (UI.section === 'combat') m.innerHTML = rCombat();
      else if (UI.section === 'npc') { if (!m.querySelector('#npcCatalogFrame')) m.innerHTML = '<iframe id="npcCatalogFrame" src="ARC_NPC_Catalog_V2.html" title="Catálogo de NPCs" style="width:100%;height:100%;border:0;display:block;background:var(--bg)"></iframe>'; }
      else if (UI.section === 'conceito') m.innerHTML = UI.cId && findC(UI.cId) ? rConceito(findC(UI.cId)) : emptyMain('✦', 'Selecione um Conceito');
      else if (UI.section === 'artefato') m.innerHTML = UI.artId && findArt(UI.artTier, UI.artId) ? rArtefato(findArt(UI.artTier, UI.artId), UI.artTier) : emptyMain('◆', 'Selecione um Artefato');
      else if (UI.section === 'jogadores') m.innerHTML = UI.playerId && findP(UI.playerId) ? rPlayer(findP(UI.playerId)) : emptyMain('◉', 'Selecione um Jogador');
      else if (UI.section === 'mundo') m.innerHTML = rMundo();
      else if (UI.section === 'armas') {
        if (UI.armCat === 'arma' && UI.armId && findArma(UI.armId)) m.innerHTML = rArma(findArma(UI.armId));
        else if (UI.armCat === 'implante' && UI.armId && findImp(UI.armId)) m.innerHTML = rImplante(findImp(UI.armId));
        else m.innerHTML = emptyMain('⌖', 'Selecione ou crie um item');
      }
      else if (UI.section === 'notas') { if (UI.geral) m.innerHTML = rNotasGeral(); else if (UI.sessaoId && findSessao(UI.sessaoId)) m.innerHTML = rSessao(findSessao(UI.sessaoId)); else m.innerHTML = emptyMain('✎', 'Selecione uma Sessão'); }
    }
    function emptyMain(ic, txt) { return `<div class="empty-main"><div class="em-icon">${ic}</div><div class="em-text">${txt}</div><div class="em-sub">ou crie um novo</div></div>` }

    function lpNPC() {
      const items = S.npcs.map(n => `<div class="lp-item ${n.id === UI.npcId ? 'on' : ''}" onclick="selNPC(${n.id})"><div class="lp-item-name">${esc(n.name) || 'Sem Nome'}</div><div class="lp-item-sub"><span class="bdg bdg-blue" style="font-size:7px">NPC</span><span style="font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--red)">♥ ${n.hpCur || n.hpMax || 20}/${n.hpMax || 20}</span>${n.rank ? `<span style="font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--txt-d)">R${n.rank}</span>` : ''}</div></div>`).join('') || '<div class="empty-l">Nenhum NPC.</div>';
      return `<div class="lp-hdr"><span class="lp-title">NPCs</span><span class="lp-count">${S.npcs.length} entrada${S.npcs.length !== 1 ? 's' : ''}</span></div><div class="lp-search-wrap"><input class="lp-search" placeholder="BUSCAR..." oninput="filterNPCs(this.value)"></div><button class="lp-add" onclick="addNPC()">+ NOVO NPC</button><div class="lp-items" id="npcListItems">${items}</div>`;
    }
    function filterNPCs(q) {
      const w = document.getElementById('npcListItems'); if (!w) return;
      const f = S.npcs.filter(n => (n.name || '').toLowerCase().includes(q.toLowerCase()));
      w.innerHTML = f.map(n => `<div class="lp-item ${n.id === UI.npcId ? 'on' : ''}" onclick="selNPC(${n.id})"><div class="lp-item-name">${esc(n.name) || 'Sem Nome'}</div><div class="lp-item-sub"><span class="bdg bdg-blue" style="font-size:7px">NPC</span><span style="font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--red)">♥ ${n.hpCur || n.hpMax || 20}/${n.hpMax || 20}</span></div></div>`).join('') || '<div class="empty-l">Nenhum resultado.</div>';
    }
    function lpConceito() {
      const items = S.conceitos.map(c => `<div class="lp-item ${c.id === UI.cId ? 'on' : ''}" onclick="selC(${c.id})"><div class="lp-item-name">${esc(c.name) || 'Sem Nome'}</div><div class="lp-item-sub"><span class="bdg bdg-purple" style="font-size:7px">${c.tipo || '?'}</span><span style="font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--gold)">${c.coeCur || 100}/${c.coeMax || 100}</span></div></div>`).join('') || '<div class="empty-l">Nenhum conceito.</div>';
      return `<div class="lp-hdr"><span class="lp-title">CONCEITOS</span><span class="lp-count">${S.conceitos.length}</span></div><button class="lp-add" onclick="addConceito()">+ NOVO CONCEITO</button><div class="lp-items" style="flex:1">${items}</div>`;
    }
    function lpArtefato() {
      let html = `<div class="lp-hdr"><span class="lp-title">ARTEFATOS</span></div><div class="lp-items" style="flex:1;padding:4px 5px">`;
      TIERS.forEach(tier => {
        const col = TCOL[tier]; const arr = S.artefatos[tier] || [];
        html += `<div class="tg-hdr"><span class="tg-lbl" style="color:var(--${col})">${TLBL[tier]} (${arr.length})</span><button class="tg-add" onclick="addArt('${tier}')">+</button></div>`;
        if (arr.length) html += arr.map(a => `<div class="lp-item ${a.id === UI.artId && UI.artTier === tier ? 'on' : ''}" onclick="selArt('${tier}',${a.id})" style="padding:6px 9px;margin-left:4px"><div class="lp-item-name" style="font-size:12px">${esc(a.name) || 'Sem Nome'}</div>${a.owner ? `<div style="font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--txt-d)">→ ${esc(a.owner)}</div>` : ''}</div>`).join('');
        else html += '<div style="font-family:\'Share Tech Mono\',monospace;font-size:8px;color:var(--txt-d);text-align:center;padding:5px 0">Nenhum.</div>';
      });
      html += `</div>`; return html;
    }
    function lpNotas() {
      const items = S.sessoes.map(s => `<div class="lp-item ${s.id === UI.sessaoId && !UI.geral ? 'on' : ''}" onclick="selSessao(${s.id})"><div class="lp-item-name">${esc(s.title) || 'Sessão sem título'}</div><div class="lp-item-sub"><span class="bdg bdg-blue" style="font-size:7px">SESSÃO</span>${s.num != null ? `<span style="font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--txt-d)">#${s.num}</span>` : ''}</div></div>`).join('') || '<div class="empty-l">Nenhuma sessão.</div>';
      return `<div class="lp-hdr"><span class="lp-title">NOTAS DE SESSÃO</span><span class="lp-count">${S.sessoes.length}</span></div><button class="lp-add" onclick="addSessao()">+ NOVA SESSÃO</button><div class="lp-items" style="flex:1">${items}</div><div class="lp-item ${UI.geral ? 'on' : ''}" onclick="showGeral()" style="margin:4px 7px;border:1px solid var(--bd);background:rgba(0,212,255,.02)"><div class="lp-item-name" style="font-size:12px;color:var(--blue)">✎ NOTAS GERAIS</div></div>`;
    }

    function lpArmas() {
      const armas = S.armaLib.armas || []; const imps = S.armaLib.implantes || [];
      let html = `<div class="lp-hdr"><span class="lp-title">ARSENAL</span><span class="lp-count">${armas.length + imps.length}</span></div>`;
      html += `<div class="lp-search-wrap"><input class="lp-search" placeholder="BUSCAR..." oninput="filterArm(this.value)"></div>`;
      html += `<div class="lp-items" id="armListItems" style="flex:1;padding:4px 5px">`;
      html += `<div class="tg-hdr"><span class="tg-lbl" style="color:var(--red)">ARMAS (${armas.length})</span><button class="tg-add" onclick="addArma()">+</button></div>`;
      if (armas.length) {
        html += armas.map(w => `<div class="lp-item ${UI.armCat === 'arma' && w.id === UI.armId ? 'on' : ''}" onclick="selArm('arma',${w.id})" style="padding:6px 9px;margin-left:4px">
      <div class="lp-item-name" style="font-size:12px">${esc(w.name) || 'Sem Nome'}</div>
      <div class="lp-item-sub">
        ${w.cat ? `<span class="bdg bdg-red" style="font-size:7px">${esc(w.cat)}</span>` : ''}
        <span style="font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--gold)">${esc(w.dmg || '—')}</span>
        ${w.type && w.type !== 'Normal' ? `<span style="font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--purple-b)">${esc(w.type)}</span>` : ''}
      </div>
    </div>`).join('');
      } else {
        html += `<div style="font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--txt-d);text-align:center;padding:5px 0">Nenhuma arma.</div>`;
      }
      html += `<div class="tg-hdr" style="margin-top:7px"><span class="tg-lbl" style="color:var(--purple-b)">IMPLANTES (${imps.length})</span><button class="tg-add" onclick="addImplante()">+</button></div>`;
      if (imps.length) {
        html += imps.map(i => `<div class="lp-item ${UI.armCat === 'implante' && i.id === UI.armId ? 'on' : ''}" onclick="selArm('implante',${i.id})" style="padding:6px 9px;margin-left:4px">
      <div class="lp-item-name" style="font-size:12px">${esc(i.name) || 'Sem Nome'}</div>
      <div class="lp-item-sub">
        ${i.slot ? `<span class="bdg bdg-purple" style="font-size:7px">${esc(i.slot)}</span>` : ''}
        ${i.cat ? `<span style="font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--teal)">${esc(i.cat)}</span>` : ''}
      </div>
    </div>`).join('');
      } else {
        html += `<div style="font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--txt-d);text-align:center;padding:5px 0">Nenhum implante.</div>`;
      }
      html += `</div>`;
      return html;
    }
    function filterArm(q) {
      q = (q || '').toLowerCase();
      const w = document.getElementById('armListItems'); if (!w) return;
      const armas = (S.armaLib.armas || []).filter(x => (x.name || '').toLowerCase().includes(q) || (x.cat || '').toLowerCase().includes(q));
      const imps = (S.armaLib.implantes || []).filter(x => (x.name || '').toLowerCase().includes(q) || (x.cat || '').toLowerCase().includes(q) || (x.slot || '').toLowerCase().includes(q));
      let html = `<div class="tg-hdr"><span class="tg-lbl" style="color:var(--red)">ARMAS (${armas.length})</span><button class="tg-add" onclick="addArma()">+</button></div>`;
      html += armas.map(x => `<div class="lp-item ${UI.armCat === 'arma' && x.id === UI.armId ? 'on' : ''}" onclick="selArm('arma',${x.id})" style="padding:6px 9px;margin-left:4px"><div class="lp-item-name" style="font-size:12px">${esc(x.name) || '—'}</div></div>`).join('') || '<div style="font-family:\'Share Tech Mono\',monospace;font-size:8px;color:var(--txt-d);text-align:center;padding:5px 0">—</div>';
      html += `<div class="tg-hdr" style="margin-top:7px"><span class="tg-lbl" style="color:var(--purple-b)">IMPLANTES (${imps.length})</span><button class="tg-add" onclick="addImplante()">+</button></div>`;
      html += imps.map(x => `<div class="lp-item ${UI.armCat === 'implante' && x.id === UI.armId ? 'on' : ''}" onclick="selArm('implante',${x.id})" style="padding:6px 9px;margin-left:4px"><div class="lp-item-name" style="font-size:12px">${esc(x.name) || '—'}</div></div>`).join('') || '<div style="font-family:\'Share Tech Mono\',monospace;font-size:8px;color:var(--txt-d);text-align:center;padding:5px 0">—</div>';
      w.innerHTML = html;
    }

    function addArma() {
      const w = { id: uid(), name: 'Nova Arma', cat: 'Arma Branca', dmg: '1d6', type: 'Normal', rank: 'C', ataque: 'Corpo', alcance: 'Curto', mun: '', props: '', effect: '', desc: '' };
      S.armaLib.armas.push(w); UI.section = 'armas'; UI.armCat = 'arma'; UI.armId = w.id; renderApp(); autosave();
    }
    function addImplante() {
      const i = { id: uid(), name: 'Novo Implante', cat: 'Cibernético', slot: 'Braço', rank: 'C', cost: '', effect: '', drawback: '', desc: '' };
      S.armaLib.implantes.push(i); UI.section = 'armas'; UI.armCat = 'implante'; UI.armId = i.id; renderApp(); autosave();
    }
    function delArma(id) { arcConfirm('Remover arma da biblioteca?').then(ok => { if (!ok) return; S.armaLib.armas = S.armaLib.armas.filter(w => w.id !== id); if (UI.armId === id) UI.armId = S.armaLib.armas.length ? S.armaLib.armas[0].id : null; renderApp(); autosave() }) }
    function delImplante(id) { arcConfirm('Remover implante da biblioteca?').then(ok => { if (!ok) return; S.armaLib.implantes = S.armaLib.implantes.filter(w => w.id !== id); if (UI.armId === id) UI.armId = S.armaLib.implantes.length ? S.armaLib.implantes[0].id : null; renderApp(); autosave() }) }
    function aWF(id, f, v) { const w = findArma(id); if (!w) return; w[f] = v; autosave() }
    function aIF(id, f, v) { const i = findImp(id); if (!i) return; i[f] = v; autosave() }
    function dupArma(id) { const w = findArma(id); if (!w) return; const c = { ...w, id: uid(), name: (w.name || '') + ' (cópia)' }; S.armaLib.armas.push(c); UI.armId = c.id; renderApp(); autosave(); }
    function dupImp(id) { const i = findImp(id); if (!i) return; const c = { ...i, id: uid(), name: (i.name || '') + ' (cópia)' }; S.armaLib.implantes.push(c); UI.armId = c.id; renderApp(); autosave(); }

    function rArma(w) {
      if (!w) return emptyMain('⌖', 'Arma não encontrada');
      const used = S.npcs.filter(n => (n.weapons || []).some(x => x.libId === w.id)).map(n => n.name);
      return `<div class="dw">
  <div class="d-hdr">
    <div>
      <input style="background:transparent;border:none;border-bottom:1px solid rgba(239,68,68,.25);color:var(--txt);font-family:'Orbitron',monospace;font-size:20px;font-weight:700;outline:none;padding:2px 0;min-width:240px" value="${esc(w.name)}" oninput="aWF(${w.id},'name',this.value)">
      <div class="d-badges">
        <span class="bdg bdg-red">${esc(w.cat || '—')}</span>
        <span class="bdg bdg-gold">${esc(w.dmg || '—')}</span>
        ${w.type && w.type !== 'Normal' ? `<span class="bdg bdg-purple">${esc(w.type)}</span>` : `<span class="bdg bdg-blue">${esc(w.type || 'Normal')}</span>`}
        ${w.rank && w.rank !== '—' ? `<span class="bdg bdg-teal">RANK ${esc(w.rank)}</span>` : ''}
      </div>
    </div>
    <div class="d-acts">
      <button class="btn btn-blue btn-sm" onclick="openLibPicker('arma','npc')">▶ ATRIBUIR A NPC</button>
      <button class="btn btn-gold btn-sm" onclick="dupArma(${w.id})">⎘ DUPLICAR</button>
      <button class="btn btn-sm" style="border-color:rgba(239,68,68,.25);color:rgba(239,68,68,.45)" onclick="delArma(${w.id})">[ DELETAR ]</button>
    </div>
  </div>
  <div class="d-sep"></div>
  <div class="sb top">IDENTIDADE</div>
  <div class="g3 mb8">
    <div class="field"><span class="lbl">NOME</span><input class="inp" value="${esc(w.name)}" oninput="aWF(${w.id},'name',this.value)"></div>
    <div class="field"><span class="lbl">CATEGORIA</span><select class="inp" onchange="aWF(${w.id},'cat',this.value)">${WCATS.map(c => `<option${c === w.cat ? ' selected' : ''}>${c}</option>`).join('')}</select></div>
    <div class="field"><span class="lbl">RANK REQUERIDO</span><select class="inp" onchange="aWF(${w.id},'rank',this.value)">${WRANKS.map(r => `<option${r === w.rank ? ' selected' : ''}>${r}</option>`).join('')}</select></div>
  </div>
  <div class="sb">DANO & ATAQUE</div>
  <div class="g4 mb8">
    <div class="field"><span class="lbl">DANO</span><input class="inp" value="${esc(w.dmg || '')}" oninput="aWF(${w.id},'dmg',this.value)" placeholder="ex: 1d8+Corpo"></div>
    <div class="field"><span class="lbl">TIPO</span><select class="inp" onchange="aWF(${w.id},'type',this.value)">${WTYPES.map(t => `<option${t === w.type ? ' selected' : ''}>${t}</option>`).join('')}</select></div>
    <div class="field"><span class="lbl">ATQ. BASE</span><select class="inp" onchange="aWF(${w.id},'ataque',this.value)">${['Corpo', 'Mente', 'Alma', '—'].map(a => `<option${a === w.ataque ? ' selected' : ''}>${a}</option>`).join('')}</select></div>
    <div class="field"><span class="lbl">ALCANCE</span><select class="inp" onchange="aWF(${w.id},'alcance',this.value)">${['Corpo a Corpo', 'Curto', 'Médio', 'Longo', 'Extremo'].map(a => `<option${a === w.alcance ? ' selected' : ''}>${a}</option>`).join('')}</select></div>
  </div>
  <div class="g2 mb12">
    <div class="field"><span class="lbl">MUNIÇÃO / CARGA</span><input class="inp" value="${esc(w.mun || '')}" oninput="aWF(${w.id},'mun',this.value)" placeholder="ex: 8 balas, 3 cargas..."></div>
    <div class="field"><span class="lbl">PROPRIEDADES</span><input class="inp" value="${esc(w.props || '')}" oninput="aWF(${w.id},'props',this.value)" placeholder="Duas mãos, Sutil, Pesada..."></div>
  </div>
  <div class="sb gold">EFEITO ESPECIAL</div>

    function arcConfirm(msg) {

        function close(v) { wrap.remove(); document.removeEventListener('keydown', onKey); resolve(v) }
        function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); close(false) } else if (e.key === 'Enter') { e.preventDefault(); close(true) } }
        wrap.addEventListener('click', e => {
          if (e.target === wrap) return close(false);
          const a = e.target.closest('[data-act]'); if (a) close(a.dataset.act === 'ok');
        });
        document.addEventListener('keydown', onKey);
        document.body.appendChild(wrap);
        setTimeout(() => { const b = wrap.querySelector('[data-act="ok"]'); if (b) b.focus() }, 20);
      });
    }

    function addComb() {
      const name = gv('cName').trim() || 'Combatente'; const init = parseInt(gv('cInit')) || 0; const hp = parseInt(gv('cHP')) || 20; const ca = parseInt(gv('cCA')) || 10;

      ['cName', 'cInit', 'cHP', 'cCA'].forEach(id => { const e = document.getElementById(id); if (e) e.value = '' });
      renderMain(); autosave();
    }
    function remComb(id) { S.combatants = S.combatants.filter(c => c.id !== id); renderMain(); autosave() }
    function sortInit() { S.combatants.sort((a, b) => b.init - a.init); S.cur = 0; renderMain(); autosave() }
    function nextTurn() { if (!S.combatants.length) return; S.cur = (S.cur + 1) % S.combatants.length; renderMain(); autosave() }

    function rollQ() {
      const die = parseInt(gv('qDie').replace('d', '')); const qty = Math.min(20, parseInt(gv('qQty')) || 1); const bonus = parseInt(gv('qBonus')) || 0;
      let rolls = []; for (let i = 0; i < qty; i++)rolls.push(Math.floor(Math.random() * die) + 1);
      const total = rolls.reduce((a, b) => a + b, 0) + bonus;
      const r = document.getElementById('qResult'); if (r) r.textContent = total;
      const h = document.getElementById('rollHist');
      if (h) { h.innerHTML = `<div style="margin-bottom:2px;color:var(--blue)">${qty}d${die}${bonus ? '+' + bonus : ''}: [${rolls.join('+')}]=${total}</div>` + h.innerHTML; if (h.children.length > 10) h.removeChild(h.lastChild) }
    }
    function rollChance() {
      const t = parseInt(gv('chVal')) || 20; const r = Math.floor(Math.random() * 100) + 1;
      const el = document.getElementById('chResult');
      if (el) { el.textContent = r + ' — ' + (r <= t ? 'SUCESSO' : 'FALHA'); el.style.color = r <= t ? 'var(--green)' : 'var(--red)' }

      if (tier === 'divino') { a.conceito = ''; a.guardiao = ''; a.efeitoPassivo = ''; a.habEspecial = ''; }
      else if (tier === 'anciao') { a.prereq = ''; a.evolucao = ''; a.efeito = ''; }
      else if (tier === 'mitico') { a.lenda = ''; a.titulo = ''; a.tituloRank = 'C'; a.tituloSkills = []; a.efeito = ''; }
      else if (tier === 'lendario') { a.efeito = ''; }
      S.artefatos[tier].push(a); UI.artTier = tier; UI.artId = a.id; renderApp(); autosave();
    }

    <div class="trow thdr" style="grid-template-columns:1fr 80px 1fr 22px"><span>NOME</span><span>STATUS</span><span>DESCRIÇÃO</span><span></span></div>
    ${S.locais.map(l => `<div class="trow" style="grid-template-columns:1fr 80px 1fr 22px"><input class="wi" value="${esc(l.name || '')}" oninput="mF('locais',${l.id},'name',this.value)" placeholder="Local"><select class="wi" onchange="mF('locais',${l.id},'status',this.value)" style="font-size:10px">${['Ativo', 'Destruído', 'Controlado', 'Neutro', 'Desconhecido'].map(s => `<option${s === l.status ? ' selected' : ''}>${s}</option>`).join('')}</select><input class="wi" value="${esc(l.desc || '')}" oninput="mF('locais',${l.id},'desc',this.value)" placeholder="Descrição"><button class="wrem" onclick="remLocal(${l.id})">✕</button></div>`).join('')}
    ${!S.locais.length ? '<div class="empty-l">Nenhum local.</div>' : ''}
  </div>
  <div>
    <div class="sb purple top">SEGREDOS DO MESTRE</div>
    <textarea id="secretNotesTA" class="notes-ta" style="min-height:calc(100vh - 220px)" oninput="S.secretNotes=this.value;autosave()" placeholder="Twists, segredos, lore oculta, motivações reais...">${esc(S.secretNotes)}</textarea>
  </div>
  </div></div>`;
    }

    function addSessao() {
      const s = { id: uid(), title: 'Sessão sem título', num: S.sessoes.length, data: '', players: '', aconteceu: '', combates: '', loot: '', ganchos: '', proxima: '' };
      S.sessoes.push(s); UI.sessaoId = s.id; UI.geral = false; renderApp(); autosave();
    }
    function deleteSessao(id) { arcConfirm('Remover sessão?').then(ok => { if (!ok) return; S.sessoes = S.sessoes.filter(s => s.id !== id); if (UI.sessaoId === id) UI.sessaoId = S.sessoes.length ? S.sessoes[0].id : null; renderApp(); autosave() }) }
    function sF(id, f, v) { const s = findSessao(id); if (!s) return; s[f] = v; autosave() }
    function rSessao(s) {
      if (!s) return emptyMain('✎', 'Sessão não encontrada');
      return `<div class="dw">
  <div class="d-hdr">
    <div style="flex:1">
      <input style="width:100%;background:transparent;border:none;border-bottom:1px solid rgba(0,212,255,.18);color:var(--txt);font-family:'Orbitron',monospace;font-size:22px;font-weight:700;outline:none;padding:2px 0" value="${esc(s.title || '')}" oninput="sF(${s.id},'title',this.value)" placeholder="Título da sessão">
      <div style="font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--txt-d);letter-spacing:2px;margin-top:4px">— Sessão #${s.num != null ? s.num : '?'}</div>
    </div>
    <div class="d-acts"><button class="btn btn-sm" style="border-color:rgba(239,68,68,.25);color:rgba(239,68,68,.45)" onclick="deleteSessao(${s.id})">[ DELETAR ]</button></div>
  </div>
  <div class="d-sep"></div>
  <div class="sb top">METADADOS</div>
  <div class="g3 mb12">
    <div class="field"><span class="lbl">DATA</span><input class="inp" value="${esc(s.data || '')}" oninput="sF(${s.id},'data',this.value)"></div>
    <div class="field"><span class="lbl">SESSÃO Nº</span><input class="inp" type="number" value="${s.num || 0}" oninput="sF(${s.id},'num',+this.value)"></div>
    <div class="field"><span class="lbl">PLAYERS PRESENTES</span><input class="inp" value="${esc(s.players || '')}" oninput="sF(${s.id},'players',this.value)" placeholder="Nomes dos players"></div>
  </div>
  <div class="sb blue">O QUE ACONTECEU</div>
  <textarea class="notes-ta" style="min-height:160px" oninput="sF(${s.id},'aconteceu',this.value)" placeholder="Resumo detalhado da sessão...">${esc(s.aconteceu || '')}</textarea>
  <div class="g2 mt12">
    <div><div class="sb top">NPCs & COMBATES</div><textarea class="notes-ta" style="min-height:110px" oninput="sF(${s.id},'combates',this.value)" placeholder="Quem apareceu, confrontos...">${esc(s.combates || '')}</textarea></div>
    <div><div class="sb gold top">LOOT & RECOMPENSAS</div><textarea class="notes-ta" style="min-height:110px" oninput="sF(${s.id},'loot',this.value)" placeholder="Itens, artefatos, informações...">${esc(s.loot || '')}</textarea></div>
  </div>
  <div class="g2 mt12">
    <div><div class="sb top">GANCHOS ABERTOS</div><textarea class="notes-ta" style="min-height:110px" oninput="sF(${s.id},'ganchos',this.value)" placeholder="Fios narrativos em aberto...">${esc(s.ganchos || '')}</textarea></div>
    <div><div class="sb green top">PLANO PRÓXIMA SESSÃO</div><textarea class="notes-ta" style="min-height:110px" oninput="sF(${s.id},'proxima',this.value)" placeholder="O que você planeja...">${esc(s.proxima || '')}</textarea></div>
  </div>
  </div>`;
    }
    let _notesPreview = false;
    function toggleNotesPreview() { collectState(); _notesPreview = !_notesPreview; renderMain(); }
    // Renderizador Markdown minimalista (inline, sem dependências) para as Notas Gerais
    function mdToHtml(src) {
      if (!src || !src.trim()) return '<div class="md-empty">— vazio —</div>';
      const escH = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const inline = t => escH(t)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/__([^_]+)__/g, '<strong>$1</strong>')
        .replace(/\*([^*]+)\*/g, '<em>$1</em>')
        .replace(/~~([^~]+)~~/g, '<del>$1</del>')
        .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      const lines = src.replace(/\r\n/g, '\n').split('\n');
      const out = []; let list = null, para = [];
      const closePara = () => { if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } };
      const closeList = () => { if (list) { out.push('</' + list + '>'); list = null; } };
      for (const raw of lines) {
        const line = raw.replace(/\s+$/, ''); let m;
        if (!line.trim()) { closePara(); closeList(); continue; }
        if (m = line.match(/^(#{1,6})\s+(.*)$/)) { closePara(); closeList(); const l = m[1].length; out.push('<h' + l + '>' + inline(m[2]) + '</h' + l + '>'); continue; }
        if (/^(---|\*\*\*|___)\s*$/.test(line)) { closePara(); closeList(); out.push('<hr>'); continue; }
        if (m = line.match(/^>\s?(.*)$/)) { closePara(); closeList(); out.push('<blockquote>' + inline(m[1]) + '</blockquote>'); continue; }
        if (m = line.match(/^\s*[-*+]\s+(.*)$/)) { closePara(); if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inline(m[1]) + '</li>'); continue; }
        if (m = line.match(/^\s*\d+\.\s+(.*)$/)) { closePara(); if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inline(m[1]) + '</li>'); continue; }
        para.push(line);
      }
      closePara(); closeList();
      return '<div class="md-view">' + out.join('') + '</div>';
    }
    function rNotasGeral() {
      const hdr = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><div class="sb top" style="margin:0;flex:1">NOTAS GERAIS DA CAMPANHA</div><button class="btn ${_notesPreview ? 'btn-gold' : 'btn-blue'} btn-sm" onclick="toggleNotesPreview()">${_notesPreview ? '✎ EDITAR' : '◳ VISUALIZAR'}</button></div>`;
      const body = _notesPreview
        ? `<div class="md-view" style="min-height:calc(100vh - 150px)">${mdToHtml(S.campaignNotes || '')}</div>`
        : `<textarea id="campaignNotesTA" class="notes-ta" style="min-height:calc(100vh - 150px)" oninput="S.campaignNotes=this.value;autosave()" placeholder="Notas gerais, lore, arcos... (Markdown: # título, **negrito**, *itálico*, - lista, 1. lista, > citação, \`código\`, [link](url), ---)">${esc(S.campaignNotes)}</textarea>`;
      return `<div class="dw">${hdr}${body}</div>`;
    }

    window.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveData() } });

    // ── AUTO-FORMAT DE NOTAS: continuação de listas (- e 1.) ao apertar Enter ──
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const ta = e.target;
      if (!ta || ta.tagName !== 'TEXTAREA' || !ta.classList.contains('notes-ta')) return;
      const txt = ta.value, pos = ta.selectionStart;
      if (pos !== ta.selectionEnd) return;
      const lineStart = txt.lastIndexOf('\n', pos - 1) + 1;
      const line = txt.substring(lineStart, pos);
      const bullet = line.match(/^(\s*)-\s(.+)/);
      const numbered = line.match(/^(\s*)(\d+)\.\s(.+)/);
      const emptyBullet = line.match(/^(\s*)-\s*$/);
      const emptyNum = line.match(/^(\s*)\d+\.\s*$/);
      let prefix = '';
      if (emptyBullet || emptyNum) {
        e.preventDefault();
        ta.value = txt.substring(0, lineStart) + txt.substring(pos);
        ta.setSelectionRange(lineStart, lineStart);
        ta.dispatchEvent(new Event('input', { bubbles: true }));
        return;
      }
      if (bullet) prefix = bullet[1] + '- ';
      else if (numbered) prefix = numbered[1] + (+numbered[2] + 1) + '. ';
      if (prefix) {
        e.preventDefault();
        ta.value = txt.substring(0, pos) + '\n' + prefix + txt.substring(pos);
        const np = pos + 1 + prefix.length;
        ta.setSelectionRange(np, np);
        ta.dispatchEvent(new Event('input', { bubbles: true }));
      }
    });

    window.addEventListener('load', init);

    // ── PONTE NPC CATÁLOGO (iframe) ↔ GM SCREEN ──
    // Os NPCs do Catálogo são persistidos dentro de S.catalogNpcs (arc_gm_v2),
    // então o botão [ SALVAR ] / EXPORTAR do GM Screen é a única fonte de verdade.
    window.addEventListener('message', e => {
      const d = e.data; if (!d || typeof d !== 'object') return;
      if (d.type === 'arc-npc-ready') {
        if (e.source) e.source.postMessage({ type: 'arc-npc-load', npcs: S.catalogNpcs || [] }, '*');
      } else if (d.type === 'arc-npc-save') {
        S.catalogNpcs = Array.isArray(d.npcs) ? d.npcs : [];
        autosave();
      }
    });

    // ═══════════════════════════════════════════════════════════════
    // FIREBASE GM SYNC — escuta players em tempo real
    // ═══════════════════════════════════════════════════════════════
    const GMF = { db: null, listener: null, roomCode: null, connected: false, players: {} };

    function gmOpenConfig() {
      const cfg = gmFbLoadConfig();
      if (cfg) { ['apiKey', 'authDomain', 'databaseURL', 'projectId'].forEach(k => { const el = document.getElementById('gm_' + k); if (el) el.value = cfg[k] || ''; }); }
      document.getElementById('fbGmModal').style.display = 'flex';
    }
    function gmFbLoadConfig() { const r = localStorage.getItem('arc_fb_config'); if (!r) return null; try { return JSON.parse(r); } catch (e) { return null; } }
    function gmFbSaveConfig() {
      const cfg = { apiKey: document.getElementById('gm_apiKey').value.trim(), authDomain: document.getElementById('gm_authDomain').value.trim(), databaseURL: document.getElementById('gm_databaseURL').value.trim(), projectId: document.getElementById('gm_projectId').value.trim() };
      if (!cfg.apiKey || !cfg.databaseURL) { gmSetStatus('err', 'Preencha pelo menos API Key e Database URL.'); return; }
      localStorage.setItem('arc_fb_config', JSON.stringify(cfg));
      document.getElementById('fbGmModal').style.display = 'none';
      gmSetStatus('connecting', 'INICIALIZANDO...');
      gmLoadFirebase(cfg);
    }

    function loadScript(src) { return new Promise((res, rej) => { if (document.querySelector(`script[src="${src}"]`)) { res(); return; } const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }

    async function gmLoadFirebase(cfg) {
      try {
        await loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js');
        if (!window.firebase.apps.length) { window.firebase.initializeApp(cfg); }
        GMF.db = window.firebase.database();
        gmSetStatus('on', 'FIREBASE PRONTO — insira o código da campanha e clique em [ MONITORAR ]');
      } catch (err) { gmSetStatus('err', 'ERRO: ' + err.message); }
    }

    function gmSyncConnect() {
      const room = (document.getElementById('gmRoomInp').value || '').trim().toUpperCase();
      const cfg = gmFbLoadConfig();
      if (!cfg) {
        gmSetStatus('err', 'Configure o Firebase primeiro → clique em [ CONFIGURAR ]');
        document.getElementById('fbGmModal').style.display = 'flex';
        return;
      }
      if (!room) {
        gmSetStatus('err', 'Preencha o CÓDIGO DA CAMPANHA e clique em [ MONITORAR ]');
        document.getElementById('gmRoomInp').focus();
        return;
      }
      if (!GMF.db) {
        gmLoadFirebase(cfg).then(() => setTimeout(() => gmDoListen(room), 1500));
        return;
      }
      gmDoListen(room);
    }

    function gmDoListen(room) {
      if (!GMF.db) { gmSetStatus('err', 'Firebase não inicializado.'); return; }
      if (GMF.listener) { GMF.listener.off(); GMF.listener = null; }
      GMF.roomCode = room; GMF.connected = true;
      gmSetStatus('connecting', `AGUARDANDO PLAYERS → campanha: ${room}`);
      document.getElementById('gmSyncStopBtn').style.display = '';
      const ref = GMF.db.ref(`arc_campaigns/${room}/players`);
      GMF.listener = ref;
      ref.on('value', snapshot => {
        const data = snapshot.val() || {};
        GMF.players = data;
        gmSetStatus('on', `ATIVO → ${room} | ${Object.keys(data).length} player(s) | ${new Date().toLocaleTimeString('pt-BR')}`);
        gmMergePlayersToState(data);
      }, err => { gmSetStatus('err', 'ERRO: ' + err.message); });
      localStorage.setItem('arc_gm_sync_room', room);
    }

    function gmSyncDisconnect() {
      if (GMF.listener) { GMF.listener.off(); GMF.listener = null; }
      GMF.connected = false; GMF.roomCode = null;
      gmSetStatus('off', 'GM SYNC OFFLINE');
      document.getElementById('gmSyncStopBtn').style.display = 'none';
      localStorage.removeItem('arc_gm_sync_room');
    }

    function gmSetStatus(state, msg) {
      const dot = document.getElementById('gmSyncDot'); const lbl = document.getElementById('gmSyncLbl');
      if (dot) dot.className = 'sync-dot ' + state; if (lbl) lbl.textContent = msg;
    }

    function gmMergePlayersToState(fbPlayers) {
      // For each firebase player, find or create in S.players
      Object.entries(fbPlayers).forEach(([pid, pd]) => {
        if (!pd || !pd._lastSync) return;
        let p = S.players.find(x => x._fbId === pid);
        if (!p) {
          // New player — create entry
          p = { id: Date.now() + Math.random(), _fbId: pid, name: pd._playerName || pd.name || 'Player', charName: '', nivel: 0, rank: 'C', natureza: '', hpCur: 10, hpMax: 10, staCur: 5, staMax: 5, san: 100, pi: 0, exposure: 0, crimes: 0, grace: {}, sin: {}, titles: '', notes: '', statusNeg: {}, statusPos: {}, attrs: { corpo: { forca: [], vigor: [], agilidade: [] }, mente: { habilidade: [], sincronia: [], intelecto: [] }, alma: { conexao: [], entendimento: [] } } };
          S.players.push(p);
        }
        // Merge fields
        const merge = ['charName', 'nivel', 'rank', 'natureza', 'hpCur', 'hpMax', 'staCur', 'staMax', 'san', 'pi', 'statusNeg', 'statusPos', 'grace', 'sin', 'titles', 'attrs'];
        merge.forEach(k => { if (pd[k] !== undefined) p[k] = pd[k]; });
        p.name = pd._playerName || pd.name || p.name;
        p._lastSync = pd._lastSync;
        p._syncAge = Date.now() - pd._lastSync;
      });
      // Persist and re-render
      autosave();
      if (UI.section === 'jogadores') {
        renderLP();
        if (UI.playerId && findP(UI.playerId)) renderMain();
      }
    }

    // Auto-reconnect GM
    window.addEventListener('load', () => {
      const savedRoom = localStorage.getItem('arc_gm_sync_room');
      if (savedRoom) {
        document.getElementById('gmRoomInp').value = savedRoom;
        const cfg = gmFbLoadConfig();
        if (cfg) {
          ['apiKey', 'authDomain', 'databaseURL', 'projectId'].forEach(k => { const el = document.getElementById('gm_' + k); if (el) el.value = cfg[k] || ''; });
          gmLoadFirebase(cfg).then(() => setTimeout(() => gmDoListen(savedRoom), 1800));
        }
      }
    }, true);

  </script>

  <!-- GM FIREBASE SYNC BAR -->
  <div class="gm-sync-bar" id="gmSyncBar">
    <div class="sync-dot off" id="gmSyncDot"></div>
    <span class="gm-sync-lbl" id="gmSyncLbl">GM SYNC OFFLINE</span>
    <input class="gm-sync-inp" id="gmRoomInp" placeholder="CÓDIGO DA CAMPANHA" maxlength="20"
      style="text-transform:uppercase">
    <button class="gm-sync-btn" onclick="gmSyncConnect()">[ MONITORAR ]</button>
    <button class="gm-sync-btn blue" id="gmSyncStopBtn" style="display:none" onclick="gmSyncDisconnect()">[ PARAR
      ]</button>
    <button class="gm-sync-btn blue" onclick="gmOpenConfig()">[ CONFIGURAR ]</button>
  </div>

  <!-- FIREBASE CONFIG MODAL (GM) -->
  <div class="fb-modal-ov" id="fbGmModal" style="display:none">
    <div class="fb-modal">
      <div class="fb-modal-tag">[ CONFIGURAÇÃO FIREBASE — MESTRE ]</div>
      <div class="fb-modal-title">Conectar ao Firebase</div>
      <div class="fb-modal-sub">Use as <strong style="color:var(--red)">mesmas credenciais</strong> dos
        players.<br>Acesse console.firebase.google.com → Configurações do Projeto → Seus apps → SDK de configuração.
      </div>
      <div class="fb-field"><span class="fb-lbl">API KEY</span><input class="fb-inp" id="gm_apiKey"
          placeholder="AIzaSy..."></div>
      <div class="fb-field"><span class="fb-lbl">AUTH DOMAIN</span><input class="fb-inp" id="gm_authDomain"
          placeholder="seu-projeto.firebaseapp.com"></div>
      <div class="fb-field"><span class="fb-lbl">DATABASE URL</span><input class="fb-inp" id="gm_databaseURL"
          placeholder="https://seu-projeto-default-rtdb.firebaseio.com"></div>
      <div class="fb-field"><span class="fb-lbl">PROJECT ID</span><input class="fb-inp" id="gm_projectId"
          placeholder="seu-projeto"></div>
      <div class="fb-acts">
        <button class="gm-sync-btn blue"
          onclick="document.getElementById('fbGmModal').style.display='none'">CANCELAR</button>
        <button class="gm-sync-btn" onclick="gmFbSaveConfig()">[ SALVAR ]</button>
      </div>
    </div>
  </div>

</body>
