<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARC V2 — Catálogo de NPCs</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    :root {
      --bg: #020408;
      --bgp: rgba(0, 212, 255, 0.03);
      --bgh: rgba(0, 212, 255, 0.06);
      --bd: rgba(0, 212, 255, 0.15);
      --bdb: rgba(0, 212, 255, 0.4);
      --blue: #00d4ff;
      --purp: #a855f7;
      --gold: #f59e0b;
      --red: #ef4444;
      --green: #10b981;
      --orange: #f97316;
      --txt: #e0f7ff;
      --dim: rgba(224, 247, 255, 0.45);
      --lbl: rgba(0, 212, 255, 0.7)
    }

    body {
      background: var(--bg);
      color: var(--txt);
      font-family: 'Rajdhani', sans-serif;
      font-size: 19px;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column
    }

    input,
    select,
    textarea,
    button {
      font-family: 'Rajdhani', sans-serif
    }

    .app {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
      z-index: 1
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: linear-gradient(rgba(0, 212, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.02) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none
    }

    .glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 60% 40% at 15% 15%, rgba(124, 58, 237, 0.06) 0%, transparent 60%)
    }

    .sidebar {
      width: 210px;
      flex-shrink: 0;
      background: rgba(2, 4, 8, 0.9);
      border-right: 1px solid rgba(239, 68, 68, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden
    }

    .sb-head {
      padding: 10px 12px 8px;
      border-bottom: 1px solid var(--bd);
      flex-shrink: 0
    }

    .sb-logo {
      font-family: 'Orbitron', monospace;
      font-size: 20px;
      font-weight: 900;
      color: var(--red);
      letter-spacing: 3px
    }

    .sb-tag {
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      color: var(--dim);
      letter-spacing: 2px;
      margin-top: 1px
    }

    .sb-list {
      flex: 1;
      overflow-y: auto;
      padding: 5px 7px
    }

    .sb-list::-webkit-scrollbar {
      width: 2px
    }

    .sb-list::-webkit-scrollbar-thumb {
      background: rgba(0, 212, 255, 0.1)
    }

    .npc-item {
      padding: 7px 9px;
      margin-bottom: 3px;
      cursor: pointer;
      border: 1px solid var(--bd);
      background: var(--bgp);
      transition: all .12s
    }

    .npc-item:hover {
      border-color: rgba(0, 212, 255, 0.3);
      background: var(--bgh)
    }

    .npc-item.active {
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.06)
    }

    .npc-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px
    }

    .npc-name {
      font-weight: 700;
      font-size: 17px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1
    }

    .npc-del {
      background: none;
      border: none;
      color: rgba(239, 68, 68, 0.25);
      cursor: pointer;
      font-size: 16px;
      padding: 0 2px;
      flex-shrink: 0
    }

    .npc-del:hover {
      color: var(--red)
    }

    .npc-badges {
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
      margin-bottom: 4px
    }

    .badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      padding: 1px 5px;
      border: 1px solid
    }

    .badge-blue {
      border-color: rgba(0, 212, 255, 0.3);
      color: var(--blue)
    }

    .badge-purp {
      border-color: rgba(168, 85, 247, 0.3);
      color: var(--purp)
    }

    .badge-gold {
      border-color: rgba(245, 158, 11, 0.3);
      color: var(--gold)
    }

    .hp-bar-wrap {
      height: 3px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 2px
    }

    .hp-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width .3s
    }

    .hp-bar-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      color: var(--dim)
    }

    .sb-add {
      margin: 6px 7px;
      flex-shrink: 0
    }

    .btn-dashed {
      width: 100%;
      padding: 7px;
      background: transparent;
      border: 1px dashed;
      font-family: 'Orbitron', monospace;
      font-size: 14px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all .15s;
      text-align: center
    }

    .btn-dashed.red {
      border-color: rgba(239, 68, 68, 0.2);
      color: rgba(239, 68, 68, 0.35)
    }

    .btn-dashed.red:hover {
      border-color: var(--red);
      color: var(--red)
    }

    .btn-dashed.blue {
      border-color: rgba(0, 212, 255, 0.2);
      color: rgba(0, 212, 255, 0.35)
    }

    .btn-dashed.blue:hover {
      border-color: var(--blue);
      color: var(--blue)
    }

    .btn-dashed.purp {
      border-color: rgba(168, 85, 247, 0.2);
      color: rgba(168, 85, 247, 0.35)
    }

    .btn-dashed.purp:hover {
      border-color: var(--purp);
      color: var(--purp)
    }

    .btn-dashed.gold {
      border-color: rgba(245, 158, 11, 0.2);
      color: rgba(245, 158, 11, 0.35)
    }

    .btn-dashed.gold:hover {
      border-color: var(--gold);
      color: var(--gold)
    }

    .btn-dashed.orange {
      border-color: rgba(249, 115, 22, 0.2);
      color: rgba(249, 115, 22, 0.35)
    }

    .btn-dashed.orange:hover {
      border-color: var(--orange);
      color: var(--orange)
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden
    }

    .main-hdr {
      flex-shrink: 0;
      padding: 8px 18px;
      border-bottom: 1px solid var(--bd);
      background: rgba(2, 4, 8, 0.7);
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(8px)
    }

    .main-name {
      font-family: 'Orbitron', monospace;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px
    }

    .main-meta {
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      color: var(--dim);
      letter-spacing: 1px;
      margin-top: 2px
    }

    .main-vitals {
      display: flex;
      gap: 14px;
      flex-shrink: 0
    }

    .vital-item {
      text-align: center
    }

    .vital-lbl {
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      color: var(--lbl);
      letter-spacing: 1px
    }

    .vital-val {
      font-family: 'Orbitron', monospace;
      font-size: 19px
    }

    .tabs {
      display: flex;
      gap: 2px;
      padding: 5px 14px;
      background: rgba(2, 4, 8, 0.5);
      border-bottom: 1px solid var(--bd);
      flex-shrink: 0;
      overflow-x: auto
    }

    .tabs::-webkit-scrollbar {
      height: 0
    }

    .tab-btn {
      padding: 6px 16px;
      font-family: 'Orbitron', monospace;
      font-size: 14px;
      letter-spacing: 2px;
      cursor: pointer;
      border: 1px solid var(--bd);
      background: transparent;
      color: var(--dim);
      transition: all .12s;
      white-space: nowrap;
      clip-path: polygon(5px 0, 100% 0, calc(100% - 5px) 100%, 0 100%)
    }

    .tab-btn:hover {
      border-color: var(--bdb);
      color: var(--txt)
    }

    .tab-btn.active {
      border-color: var(--blue);
      background: rgba(0, 212, 255, 0.08);
      color: var(--blue)
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 14px 18px
    }

    .content::-webkit-scrollbar {
      width: 3px
    }

    .content::-webkit-scrollbar-thumb {
      background: rgba(0, 212, 255, 0.08)
    }

    .sec-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 9px;
      margin-top: 14px
    }

    .sec-title:first-child {
      margin-top: 0
    }

    .sec-title-txt {
      font-family: 'Orbitron', monospace;
      font-size: 14px;
      letter-spacing: 3px;
      white-space: nowrap
    }

    .sec-line {
      flex: 1;
      height: 1px
    }

    .panel {
      background: var(--bgp);
      border: 1px solid var(--bd);
      padding: 11px;
      margin-bottom: 8px;
      transition: border-color .15s
    }

    .panel:hover {
      border-color: rgba(0, 212, 255, 0.22)
    }

    .inp {
      background: rgba(0, 212, 255, 0.04);
      border: 1px solid var(--bd);
      color: var(--txt);
      font-family: 'Share Tech Mono', monospace;
      font-size: 17px;
      padding: 5px 9px;
      outline: none;
      width: 100%;
      transition: border-color .15s
    }

    .inp:focus {
      border-color: var(--blue);
      background: rgba(0, 212, 255, 0.07)
    }

    .sel {
      background: #050b14;
      border: 1px solid var(--bd);
      color: var(--txt);
      font-family: 'Share Tech Mono', monospace;
      font-size: 16px;
      padding: 5px 8px;
      outline: none;
      cursor: pointer;
      width: 100%
    }

    .sel option {
      background: #050b14
    }

    .lbl {
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      color: var(--lbl);
      letter-spacing: 1.5px;
      display: block;
      margin-bottom: 3px
    }

    .g2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px
    }

    .g3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 9px
    }

    .g4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px
    }

    .sk-card {
      background: rgba(0, 212, 255, 0.02);
      border: 1px solid var(--bd);
      padding: 8px 10px;
      margin-bottom: 5px;
      transition: border-color .12s
    }

    .sk-card:hover {
      border-color: rgba(0, 212, 255, 0.25)
    }

    .sk-card.lb {
      background: rgba(245, 158, 11, 0.03);
      border-color: rgba(245, 158, 11, 0.2)
    }

    .sk-card.ult {
      background: rgba(245, 158, 11, 0.04);
      border-color: rgba(245, 158, 11, 0.25)
    }

    .sk-card.esp {
      background: rgba(168, 85, 247, 0.03);
      border-color: rgba(168, 85, 247, 0.2)
    }

    .sk-hdr {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 7px;
      margin-bottom: 5px
    }

    .sk-name {
      font-weight: 700;
      font-size: 17px;
      flex: 1
    }

    .sk-meta {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-shrink: 0;
      flex-wrap: wrap;
      justify-content: flex-end
    }

    .sk-desc {
      font-size: 16px;
      color: var(--dim);
      line-height: 1.6
    }

    .sk-limit {
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      color: var(--gold);
      margin-top: 3px
    }

    .act-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      padding: 2px 6px;
      border: 1px solid;
      white-space: nowrap
    }

    .cost-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      padding: 2px 6px;
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: var(--gold)
    }

    .bar-wrap {
      margin-bottom: 10px
    }

    .bar-hdr {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px
    }

    .bar-lbl {
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      color: var(--lbl);
      letter-spacing: 1px
    }

    .bar-vals {
      font-family: 'Orbitron', monospace;
      font-size: 17px
    }

    .bar-track {
      height: 5px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
      overflow: hidden
    }

    .bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width .4s
    }

    .bar-hp {
      background: linear-gradient(90deg, #dc2626, #ef4444)
    }

    .bar-sta {
      background: linear-gradient(90deg, #1d4ed8, #3b82f6)
    }

    .bar-san {
      background: linear-gradient(90deg, #7c3aed, #a855f7)
    }

    .stat-box {
      text-align: center;
      padding: 10px;
      background: var(--bgp);
      border: 1px solid var(--bd)
    }

    .stat-lbl {
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      color: var(--lbl);
      letter-spacing: 1px;
      margin-bottom: 4px
    }

    .stat-val {
      font-family: 'Orbitron', monospace;
      font-size: 28px;
      font-weight: 700
    }

    .stat-note {
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      color: var(--dim);
      margin-top: 3px
    }

    .calc-row {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      padding: 2px 0;
      border-bottom: 1px solid rgba(0, 212, 255, 0.05)
    }

    .calc-key {
      font-family: 'Share Tech Mono', monospace;
      color: var(--dim)
    }

    .calc-val {
      font-family: 'Orbitron', monospace;
      font-size: 15px
    }

    .calc-total {
      display: flex;
      justify-content: space-between;
      padding: 4px 0 2px;
      border-top: 1px solid var(--bdb);
      margin-top: 3px
    }

    .calc-total .calc-key {
      color: var(--lbl)
    }

    /* Level history */
    .lv-entry {
      border: 1px solid var(--bd);
      margin-bottom: 6px;
      background: rgba(0, 212, 255, 0.015)
    }

    .lv-hdr {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      cursor: pointer;
      user-select: none;
      transition: background .1s
    }

    .lv-hdr:hover {
      background: rgba(0, 212, 255, 0.03)
    }

    .lv-hdr.active {
      background: rgba(0, 212, 255, 0.05);
      border-bottom: 1px solid var(--bd)
    }

    .lv-num {
      font-family: 'Orbitron', monospace;
      font-size: 17px;
      font-weight: 700;
      color: var(--blue);
      width: 54px;
      flex-shrink: 0
    }

    .lv-sum {
      font-family: 'Share Tech Mono', monospace;
      font-size: 15px;
      color: var(--dim);
      flex: 1;
      line-height: 1.4
    }

    .lv-warn {
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      color: var(--gold);
      padding: 2px 6px;
      border: 1px solid rgba(245, 158, 11, 0.3)
    }

    .lv-body {
      padding: 10px;
      display: none
    }

    .lv-body.open {
      display: block
    }

    .lv-section {
      margin-bottom: 10px
    }

    .lv-section-title {
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      color: var(--lbl);
      letter-spacing: 2px;
      margin-bottom: 5px
    }

    .attr-pick-row {
      display: flex;
      gap: 5px;
      align-items: center;
      margin-bottom: 5px;
      flex-wrap: wrap
    }

    .attr-pick-lbl {
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      color: var(--dim);
      width: 50px;
      flex-shrink: 0
    }

    .attr-btn {
      padding: 4px 11px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 15px;
      cursor: pointer;
      border: 1px solid rgba(0, 212, 255, 0.15);
      background: transparent;
      color: var(--dim);
      transition: all .1s
    }

    .attr-btn:hover {
      border-color: var(--blue);
      color: var(--txt)
    }

    .attr-btn.sel {
      border-color: var(--blue);
      background: rgba(0, 212, 255, 0.1);
      color: var(--blue)
    }

    .attr-btn.sel-mente {
      border-color: var(--purp);
      background: rgba(168, 85, 247, 0.1);
      color: var(--purp)
    }

    .attr-btn.sel-alma {
      border-color: var(--gold);
      background: rgba(245, 158, 11, 0.1);
      color: var(--gold)
    }

    /* ── Sub-attribute option cards ── */
    .sub-opt-grid {
      display: grid;
      gap: 5px;
      margin-bottom: 6px
    }

    .sub-opt {
      padding: 8px 10px;
      border: 1px solid var(--bd);
      cursor: pointer;
      transition: border-color .12s, background .12s;
      text-align: left;
      background: rgba(0, 0, 0, 0.15);
      position: relative;
      user-select: none
    }

    .sub-opt::after {
      content: '';
      position: absolute;
      top: 8px;
      right: 8px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all .15s
    }

    .sub-opt-name {
      font-family: 'Orbitron', monospace;
      font-size: 14px;
      letter-spacing: 2px;
      margin-bottom: 3px;
      transition: color .12s
    }

    .sub-opt-sk {
      font-family: 'Share Tech Mono', monospace;
      font-size: 15px;
      color: var(--dim);
      line-height: 1.3
    }

    /* Blue = Corpo */
    .sub-opt-blue {
      border-color: rgba(0, 212, 255, 0.1)
    }

    .sub-opt-blue:hover {
      border-color: rgba(0, 212, 255, 0.35);
      background: rgba(0, 212, 255, 0.03)
    }

    .sub-opt-blue .sub-opt-name {
      color: rgba(0, 212, 255, 0.5)
    }

    .sub-opt-blue.sel-blue {
      border-color: var(--blue);
      background: rgba(0, 212, 255, 0.08)
    }

    .sub-opt-blue.sel-blue .sub-opt-name {
      color: var(--blue)
    }

    .sub-opt-blue.sel-blue::after {
      background: var(--blue);
      border-color: var(--blue);
      box-shadow: 0 0 6px rgba(0, 212, 255, 0.6)
    }

    /* Purple = Mente */
    .sub-opt-purp {
      border-color: rgba(168, 85, 247, 0.1)
    }

    .sub-opt-purp:hover {
      border-color: rgba(168, 85, 247, 0.35);
      background: rgba(168, 85, 247, 0.03)
    }

    .sub-opt-purp .sub-opt-name {
      color: rgba(168, 85, 247, 0.5)
    }

    .sub-opt-purp.sel-purp {
      border-color: var(--purp);
      background: rgba(168, 85, 247, 0.08)
    }

    .sub-opt-purp.sel-purp .sub-opt-name {
      color: var(--purp)
    }

    .sub-opt-purp.sel-purp::after {
      background: var(--purp);
      border-color: var(--purp);
      box-shadow: 0 0 6px rgba(168, 85, 247, 0.6)
    }

    /* Gold = Alma */
    .sub-opt-gold {
      border-color: rgba(245, 158, 11, 0.1)
    }

    .sub-opt-gold:hover {
      border-color: rgba(245, 158, 11, 0.35);
      background: rgba(245, 158, 11, 0.03)
    }

    .sub-opt-gold .sub-opt-name {
      color: rgba(245, 158, 11, 0.5)
    }

    .sub-opt-gold.sel-gold {
      border-color: var(--gold);
      background: rgba(245, 158, 11, 0.08)
    }

    .sub-opt-gold.sel-gold .sub-opt-name {
      color: var(--gold)
    }

    .sub-opt-gold.sel-gold::after {
      background: var(--gold);
      border-color: var(--gold);
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.6)
    }

    /* Save button */
    .save-npc-btn {
      padding: 4px 13px;
      background: transparent;
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: rgba(16, 185, 129, 0.55);
      font-family: 'Orbitron', monospace;
      font-size: 12px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all .18s;
      margin-left: 14px;
      flex-shrink: 0
    }

    .save-npc-btn:hover {
      border-color: var(--green);
      color: var(--green);
      background: rgba(16, 185, 129, 0.07)
    }

    .save-npc-btn.saved {
      border-color: var(--green);
      color: var(--green);
      background: rgba(16, 185, 129, 0.1)
    }

    .cls-sk {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      padding: 7px 8px;
      border: 1px solid var(--bd);
      margin-bottom: 4px;
      cursor: pointer;
      transition: all .12s
    }

    .cls-sk:hover {
      background: rgba(0, 212, 255, 0.03)
    }

    .cls-sk.sel-blue {
      border-color: var(--blue);
      background: rgba(0, 212, 255, 0.06)
    }

    .cls-sk.sel-purp {
      border-color: var(--purp);
      background: rgba(168, 85, 247, 0.06)
    }

    .cls-sk.sel-gold {
      border-color: var(--gold);
      background: rgba(245, 158, 11, 0.07)

        classeGeralSkIdx: null,
        classeEspSkIdx: null,
        crossClass: null,      // skill de OUTRA classe (níveis 5 e 15)
        crossIdx: null,
      };
    }

    // ================================================================
    // CALCULATIONS — agora baseadas no levelHistory
    // ================================================================
    // ── Helpers de atributo (pontos → valor → bônus) ──
    // Níveis 1-7: 1 ponto = 1 nível. Limit break (8,9,10): 2 pontos = 1 nível, e +1 no bônus cada.
    function pointsToValue(p) { p = p || 0; return p <= 7 ? p : Math.min(10, 7 + Math.floor((p - 7) / 2)); }
    function valueBonus(v) { v = v || 0; return Math.floor(v / 2) + Math.max(0, Math.min(3, v - 7)); }
    function entryUp(e) { if (!e) return null; if (e.up) return e.up; return e.corpoPick ? 'corpo' : e.mentePick ? 'mente' : e.almaPick ? 'alma' : null; }
    function lv0Up(lv0) { if (!lv0) return null; if (lv0.up) return lv0.up; return lv0.corpo > 0 ? 'corpo' : lv0.mente > 0 ? 'mente' : lv0.alma > 0 ? 'alma' : null; }

    // ── deriveProgression: ÚNICA caminhada canônica pela progressão ──
    // Deriva valores de atributo por PONTOS acumulados (não pelos valores absolutos
    // armazenados, que ficavam obsoletos ao editar um nível antigo → bug da Mente).
    // O atributo de cada nível é o campo `up` explícito ou, em dados legados, inferido
    // pelo pick não-nulo daquele nível (sem migração destrutiva).
    function deriveProgression(n) {
      const lh = n.levelHistory || [];
      const maxLv = n.level || 0;
      const lv0 = n.lv0 || { corpo: 0, mente: 0, alma: 0, corpoPick: null, mentePick: null, almaPick: null };
      const pts = { corpo: 0, mente: 0, alma: 0 };
      const picks = { corpo: [], mente: [], alma: [] }; // skills de subatributo indexadas por nível do atributo
      const geralSk = new Set(), espSk = new Set();
      const crossPicks = [];

      // Nível 0 (1 ponto)
      const l0up = lv0Up(lv0);
      if (l0up) { const pv = pointsToValue(pts[l0up]); pts[l0up]++; const nv = pointsToValue(pts[l0up]); if (nv > pv) picks[l0up].push(lv0[l0up + 'Pick'] || null); }
      const lv0State = { corpo: pointsToValue(pts.corpo), mente: pointsToValue(pts.mente), alma: pointsToValue(pts.alma) };

      const levels = [];
      for (let i = 0; i < maxLv; i++) {
        const e = lh[i] || {};
        const lvNum = i + 1;
        const before = { corpo: pointsToValue(pts.corpo), mente: pointsToValue(pts.mente), alma: pointsToValue(pts.alma), pts: { ...pts } };
        const beforePicks = { corpo: [...picks.corpo], mente: [...picks.mente], alma: [...picks.alma] };
        const beforeGeral = new Set(geralSk), beforeEsp = new Set(espSk), beforeCross = crossPicks.length;
        const up = entryUp(e);
        let gained = null, pickKey = null;
        if (up) { const pv = pointsToValue(pts[up]); pts[up]++; const nv = pointsToValue(pts[up]); if (nv > pv) { gained = up; pickKey = e[up + 'Pick'] || null; picks[up].push(pickKey); } }
        if (e.classeGeralSkIdx != null) geralSk.add(e.classeGeralSkIdx);
        if (e.classeEspSkIdx != null) espSk.add(e.classeEspSkIdx);
        if (e.crossClass && e.crossIdx != null) crossPicks.push({ lvNum, klass: e.crossClass, idx: e.crossIdx });
        levels.push({
          lvNum, e, up, gained, pickKey, before, beforePicks, beforeGeral, beforeEsp, beforeCross,
          after: { corpo: pointsToValue(pts.corpo), mente: pointsToValue(pts.mente), alma: pointsToValue(pts.alma), pts: { ...pts } },
          afterPicks: { corpo: [...picks.corpo], mente: [...picks.mente], alma: [...picks.alma] }
        });
      }
      return {
        maxLv, lv0State, pts: { ...pts },
        corpoPicks: picks.corpo, mentePicks: picks.mente, almaPicks: picks.alma,
        geralSk, espSk, crossPicks, levels,
        cur: { corpo: pointsToValue(pts.corpo), mente: pointsToValue(pts.mente), alma: pointsToValue(pts.alma) }
      };
    }

    function calcFromHistory(n) {
      const nat = n.natureza;
      const D = deriveProgression(n);
      const { corpoPicks, mentePicks, almaPicks, geralSk: geralSkSet, espSk: espSkSet, crossPicks, levels, cur } = D;
      const corpo0 = D.lv0State.corpo, mente0 = D.lv0State.mente;
      let hpTotal = 0, staTotal = 0, sanTotal = 0, brkdHP = [], brkdSTA = [];

      if (nat) {
        const hpB = hpBase(nat, corpo0); hpTotal = hpB;
        brkdHP.push({ k: 'Base (Nível 0)', v: hpB, note: NATURE_DATA[nat].hpF + ` (Corpo=${corpo0})` });
        const staB = staBase(nat, corpo0, mente0); staTotal = staB;
        brkdSTA.push({ k: 'Base (Nível 0)', v: staB, note: NATURE_DATA[nat].staF + ` (Corpo=${corpo0},Mente=${mente0})` });
        sanTotal = 100;
      }

      // Pele de Aço (Titã) é RETROATIVA: se o NPC tem a skill, aplica em TODOS os níveis.
      const hasPeleFinal = n.classeEsp === 'Titã' && espSkSet.has(0);

      if (nat) {
        for (const L of levels) {
          const c = L.after.corpo, m = L.after.mente, lvNum = L.lvNum;
          const hasVit = L.afterPicks.corpo[0] === 'vigor';        // Vitalidade Extra (não retroativa)
          const hasClareza = L.afterPicks.mente[0] === 'intelecto'; // Clareza Mental (não retroativa)
          let hpLv = hpPerLevel(nat, lvNum, c, m);
          let hpLvNote = `corpo=${c}, mente=${m}`;
          if (hasVit) { hpLv += 2.5; hpLvNote += '+2.5(VitExtra)'; }
          if (hasPeleFinal) { hpLv += (5 + c); hpLvNote += `+(5+${c})(PeleAço)`; }
          hpTotal += hpLv;
          brkdHP.push({ k: `NV.${lvNum}`, v: Math.round(hpLv), note: hpLvNote });
          const staLv = staPerLevel(nat, c, m);
          staTotal += staLv;
          brkdSTA.push({ k: `NV.${lvNum}`, v: staLv, note: `corpo=${c}, mente=${m}` });
          if (hasClareza) sanTotal += 5;
        }
      }

      const c = cur.corpo, m = cur.mente;
      const caBase = nat === 'Brutamontes' ? 8 : 10;
      const esquivaNat = corpoPicks[0] === 'agilidade' ? 2 : 0;
      const cb = valueBonus(c), mb = valueBonus(m);
      const caTotal = caBase + cb + mb + esquivaNat + (n.caImpl || 0) - (n.caArm || 0) + (n.caOutros || 0);

      let mov = 8;
      if (corpoPicks[1] === 'agilidade') { mov = 9 + [4, 8, 12, 16, 20].filter(l => D.maxLv >= l).length; }

      return {
        hp: { total: Math.max(1, Math.round(hpTotal)), brkd: brkdHP },
        sta: { total: Math.max(1, Math.round(staTotal)), brkd: brkdSTA },
        san: { max: Math.round(sanTotal), hasClareza: mentePicks[0] === 'intelecto', bonus: Math.round(sanTotal) - 100 },
        ca: { total: caTotal, parts: [{ k: 'Base', v: caBase }, { k: `Corpo(${c})`, v: (cb >= 0 ? '+' : '') + cb }, { k: `Mente(${m})`, v: (mb >= 0 ? '+' : '') + mb }].concat(esquivaNat ? [{ k: 'Esquiva Natural', v: '+2' }] : []).concat(n.caArm ? [{ k: 'Armadura', v: '−' + n.caArm }] : []).concat(n.caImpl ? [{ k: 'Implantes', v: '+' + n.caImpl }] : []).concat(n.caOutros ? [{ k: 'Outros', v: (n.caOutros > 0 ? '+' : '') + n.caOutros }] : []) },
        mov,
        init: valueBonus(m),
        corpoPicks, mentePicks, almaPicks,
        geralSkSet, espSkSet, crossPicks,
        curCorpo: c, curMente: m, curAlma: cur.alma,
      };
    }

    function pct(c, m) { return m > 0 ? Math.max(0, Math.min(100, (c / m) * 100)) : 0; }
    function bon(v) { const b = Math.floor((v || 0) / 2); return (b >= 0 ? '+' : '') + b; }

    // ================================================================
    // STATE
    // ================================================================
    let _uid = 0;
    function uid() { return 'npc_' + (++_uid) + '_' + Date.now(); }

    function mkNPC() {
      return {
        id: uid(), name: 'Novo NPC', role: '', faccao: '', level: 0, rank: 'C', natureza: '',
        // lv0: ponto de atributo do nível 0 (antes de qualquer level up)
        lv0: { corpo: 0, mente: 0, alma: 0, corpoPick: null, mentePick: null, almaPick: null },
        // levelHistory[i] = dados do level up para nível (i+1)
        levelHistory: [],
        classeGeral: '', classeEsp: '',
        hpCur: 20, staCur: 10, sanCur: 100,
        caArm: 0, caImpl: 0, caOutros: 0,
        reducao: 0, danoFisico: '1d6+Corpo', critMargin: 20, critMult: '2×',
        weapons: [], implants: [], titles: [], customs: [],
        pericias: [],   // nomes das perícias em que o NPC é Treinado
        statusNeg: {}, statusPos: {}, notes: ''
      };
    }

    let npcs = [mkNPC()];
    let selId = npcs[0].id;
    let activeTab = 'status';
    let openLvIdx = null; // qual entry de levelHistory está expandida
    const EMBEDDED = window.parent !== window; // true quando rodando dentro do GM Screen (iframe)

    function npc() { return npcs.find(n => n.id === selId) || npcs[0] || null; }

    // ================================================================
    // LEVEL HISTORY HELPERS
    // ================================================================
    // Retorna o estado acumulado até o nível (lv-1), ou seja, ANTES do level up lv
    function stateBeforeLevel(n, lv) {
      // Estado ANTES do level up `lv`, derivado da caminhada canônica (sem valores obsoletos).
      const D = deriveProgression(n);
      const L = D.levels[lv - 1];
      if (L) {
        return {
          corpo: L.before.corpo, mente: L.before.mente, alma: L.before.alma, pts: L.before.pts,
          corpoPicks: L.beforePicks.corpo, mentePicks: L.beforePicks.mente, almaPicks: L.beforePicks.alma,
          geralSk: L.beforeGeral, espSk: L.beforeEsp, crossCount: L.beforeCross
        };
      }
      // lv além do nível atual → estado final acumulado
      return {
        corpo: D.cur.corpo, mente: D.cur.mente, alma: D.cur.alma, pts: D.pts,
        corpoPicks: D.corpoPicks, mentePicks: D.mentePicks, almaPicks: D.almaPicks,
        geralSk: D.geralSk, espSk: D.espSk, crossCount: D.crossPicks.length
      };
    }

    // A cada nível, o NPC pode:
    // 1. Aumentar UM atributo (Corpo, Mente, ou Alma se desbloqueado) em 1 ponto
    //    → Se aumentou, deve escolher um subatributo
    // 2. A cada 3 níveis (3,6,9,12,15,18) desbloqueia 1 skill de classe geral
    //    A partir do nível 15, se tiver todas as 5 skills, pode pegar a ultimate (idx=5)
    // 3. A cada 3 níveis após nível 9 (9,12,15,18) desbloqueia 1 skill de classe esp
    //    (mesmas regras)
    // Nota: nível 1 = primeira classe geral obrigatória (mas tratamos como opcional aqui
    // pois NPCs podem não ter classes)

    function lvReqClasseGeral(lv) {
      // Skills de classe desbloqueáveis nos níveis 3,6,9,12,15 → 5 skills
      // Ultimate no nível 15 se tiver as 5 anteriores (idx 5)
      // Simplificado: a cada 3 níveis (começando no 3) você pode pegar 1 skill
      if (lv > 0 && lv % 3 === 0) return true;
      return false;
    }

    function countGeralSkills(lh) {
      let s = new Set(); (lh || []).forEach(e => { if (e.classeGeralSkIdx != null) s.add(e.classeGeralSkIdx); }); return s.size;
    }
    function countEspSkills(lh) {
      let s = new Set(); (lh || []).forEach(e => { if (e.classeEspSkIdx != null) s.add(e.classeEspSkIdx); }); return s.size;
    }

    // ================================================================
    // VALIDATION por nível
    // ================================================================
    function validateLevel(n, lv) {
      // Retorna {ok:bool, warnings:[]}
      const e = (n.levelHistory || [])[lv - 1];
      if (!e) return { ok: false, warnings: ['Nível não configurado.'] };
      const before = stateBeforeLevel(n, lv);
      const warns = [];
      const up = entryUp(e);
      const ptsB = before.pts || { corpo: 0, mente: 0, alma: 0 };

      if (!up) {
        warns.push('Nenhum ponto de atributo distribuído neste nível.');
      } else {
        // Alma requer Corpo 7 e Mente 7
        if (up === 'alma' && ((before.corpo || 0) < 7 || (before.mente || 0) < 7)) warns.push('Alma requer Corpo 7 e Mente 7.');
        // Pick obrigatório quando um nível de atributo é efetivamente ganho
        const gained = pointsToValue((ptsB[up] || 0) + 1) > pointsToValue(ptsB[up] || 0);
        if (gained && !e[up + 'Pick']) warns.push(`${up.charAt(0).toUpperCase() + up.slice(1)} subiu mas nenhum subatributo foi escolhido.`);
        if (gained && e[up + 'Pick']) {
          const pool = up === 'alma' ? SA_ALMA : SA;
          const bPicks = before[up + 'Picks'] || [];
          const pickIdx = bPicks.length;
          if (!pool[e[up + 'Pick']]?.[pickIdx]) warns.push(`Subatributo '${SUB_LBL[e[up + 'Pick']] || e[up + 'Pick']}' não tem skill no nível ${pickIdx + 1}.`);
          // Limit break: a partir do 2º pick de LB (pickIdx>7) deve continuar o mesmo subatributo
          if (pickIdx > 7 && e[up + 'Pick'] !== bPicks[7]) warns.push(`No Limit Break, o subatributo deve continuar sendo ${SUB_LBL[bPicks[7]] || bPicks[7]}.`);
        }
      }
      return { ok: warns.length === 0, warnings: warns };
    }

    // ================================================================
    // UPDATE STRATEGIES
    // ================================================================
    function upd(changes) { const n = npc(); if (!n) return; Object.assign(n, changes); save(); render(); }
    function su(f, v) { const n = npc(); if (!n) return; n[f] = v; save(); }
    function suW(i, f, v) { const n = npc(); if (!n) return; const w = [...(n.weapons || [])]; if (w[i]) w[i] = { ...w[i], [f]: v }; n.weapons = w; save(); }
    function suI(i, f, v) { const n = npc(); if (!n) return; const im = [...(n.implants || [])]; if (im[i]) im[i] = { ...im[i], [f]: v }; n.implants = im; save(); }
    function suTit(i, f, v) { const n = npc(); if (!n) return; const t = [...(n.titles || [])]; if (t[i]) t[i] = { ...t[i], [f]: v }; n.titles = t; save(); }
    function suTS(ti, si, f, v) { const n = npc(); if (!n) return; const t = [...(n.titles || [])]; if (t[ti]) { const sk = [...(t[ti].skills || [])]; if (sk[si]) sk[si] = { ...sk[si], [f]: v }; t[ti] = { ...t[ti], skills: sk } } n.titles = t; save(); }
    function suC(i, f, v) { const n = npc(); if (!n) return; const c = [...(n.customs || [])]; if (c[i]) c[i] = { ...c[i], [f]: v }; n.customs = c; save(); }
    function suLv(lvIdx, field, value) {
      const n = npc(); if (!n) return;
      const lh = [...(n.levelHistory || [])];
      if (!lh[lvIdx]) lh[lvIdx] = mkLvEntry(lvIdx > 0 ? (lh[lvIdx - 1] || { corpo: 0, mente: 0, alma: 0 }) : { corpo: 0, mente: 0, alma: 0 });
      const patch = { [field]: value };
      // Escolher um subatributo implica que o ponto deste nível foi para aquele atributo
      if (field === 'corpoPick') patch.up = 'corpo';
      else if (field === 'mentePick') patch.up = 'mente';
      else if (field === 'almaPick') patch.up = 'alma';
      lh[lvIdx] = { ...lh[lvIdx], ...patch };
      n.levelHistory = lh;
      save(); render();
    }
    // Define em qual atributo o ponto deste nível foi gasto (limpa picks ao trocar).
    function setLvUp(lvIdx, attr) {
      const n = npc(); if (!n) return;
      const lh = [...(n.levelHistory || [])];
      if (!lh[lvIdx]) lh[lvIdx] = mkLvEntry(lvIdx > 0 ? (lh[lvIdx - 1] || { corpo: 0, mente: 0, alma: 0 }) : { corpo: 0, mente: 0, alma: 0 });
      if (entryUp(lh[lvIdx]) === (attr || null)) return; // sem mudança → preserva picks
      lh[lvIdx] = { ...lh[lvIdx], up: attr || null, corpoPick: null, mentePick: null, almaPick: null };
      n.levelHistory = lh;
      save(); render();
    }
    // Skill de outra classe (níveis 5 e 15)
    function setLvCross(lvIdx, klass) {
      const n = npc(); if (!n) return;
      const lh = [...(n.levelHistory || [])];
      if (!lh[lvIdx]) lh[lvIdx] = mkLvEntry(lvIdx > 0 ? (lh[lvIdx - 1] || { corpo: 0, mente: 0, alma: 0 }) : { corpo: 0, mente: 0, alma: 0 });
      lh[lvIdx] = { ...lh[lvIdx], crossClass: klass || null, crossIdx: null };
      n.levelHistory = lh;
      save(); render();
    }

    function setNatureza(v) { upd({ natureza: v }); }
    function setClasseGeral(v) { upd({ classeGeral: v }); }
    function setClasseEsp(v) { upd({ classeEsp: v }); }
    function toggleStatus(type, s) { const n = npc(); if (!n) return; const key = type === 'neg' ? 'statusNeg' : 'statusPos'; const obj = { ...(n[key] || {}) }; obj[s] = !obj[s]; upd({ [key]: obj }); }
    function addWeapon() { const n = npc(); if (!n) return; upd({ weapons: [...(n.weapons || []), { name: '', dmg: '1d6', crit: '20', type: 'Normal', notes: '' }] }); }
    function remWeapon(i) { const n = npc(); if (!n) return; const w = [...(n.weapons || [])]; w.splice(i, 1); upd({ weapons: w }); }
    function addImplant() { const n = npc(); if (!n) return; upd({ implants: [...(n.implants || []), { name: '', slot: '', tier: 'C', effect: '' }] }); }
    function remImplant(i) { const n = npc(); if (!n) return; const im = [...(n.implants || [])]; im.splice(i, 1); upd({ implants: im }); }
    function addTitle() { const n = npc(); if (!n) return; upd({ titles: [...(n.titles || []), { id: uid(), name: '', rank: 'C', skills: [{ name: '', action: 'Passiva', cost: '', desc: '' }] }] }); }
    function remTitle(i) { const n = npc(); if (!n) return; const t = [...(n.titles || [])]; t.splice(i, 1); upd({ titles: t }); }
    function addTitleSk(ti) { const n = npc(); if (!n) return; const t = [...(n.titles || [])]; if (t[ti]) t[ti] = { ...t[ti], skills: [...(t[ti].skills || []), { name: '', action: 'Passiva', cost: '', desc: '' }] }; upd({ titles: t }); }
    function addCustom() { const n = npc(); if (!n) return; upd({ customs: [...(n.customs || []), { name: '', action: 'Passiva', cost: '', desc: '' }] }); }
    function remCustom(i) { const n = npc(); if (!n) return; const c = [...(n.customs || [])]; c.splice(i, 1); upd({ customs: c }); }

    function suLv0(field, value) {
      const n = npc(); if (!n) return;
      const lv0 = { ...(n.lv0 || { corpo: 0, mente: 0, alma: 0, corpoPick: null, mentePick: null, almaPick: null }), [field]: value };
      if (field === 'corpoPick') { lv0.up = 'corpo'; lv0.corpo = 1; }
      else if (field === 'mentePick') { lv0.up = 'mente'; lv0.mente = 1; }
      else if (field === 'almaPick') { lv0.up = 'alma'; lv0.alma = 1; }
      n.lv0 = lv0; save(); render();
    }
    // Define o atributo do ponto inicial (nível 0); limpa picks ao trocar.
    function setLv0Up(attr) {
      const n = npc(); if (!n) return;
      const base = { corpo: 0, mente: 0, alma: 0, corpoPick: null, mentePick: null, almaPick: null, up: attr || null };
      if (attr) base[attr] = 1;
      n.lv0 = base; save(); render();
    }

    function changeLevel(d) {
      const n = npc(); if (!n) return;
      const cur = n.level || 0;
      const newLv = Math.max(0, Math.min(20, cur + d));
      if (newLv === cur) return;
      const lh = [...(n.levelHistory || [])];
      if (newLv > cur) {
        // Adicionar entradas vazias
        for (let i = lh.length; i < newLv; i++) {
          const prev = i > 0 ? (lh[i - 1] || { corpo: 0, mente: 0, alma: 0 }) : { corpo: 0, mente: 0, alma: 0 };
          lh.push(mkLvEntry(prev));
        }
      } else {
        // Remover entradas excedentes
        lh.splice(newLv);
      }
      n.level = newLv; n.levelHistory = lh;
      save(); render();
    }

    function toggleLvEntry(i) { openLvIdx = openLvIdx === i ? null : i; render(); }

    // ================================================================
    // RENDER HELPERS
    // ================================================================
    function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function renderBadge(txt, cls) { return `<span class="badge badge-${cls}">${esc(txt)}</span>`; }
    function renderAB(a, c) { const col = a === 'Passiva' ? 'green' : a && a.includes('Reação') ? 'purp' : a && a.includes('Livre') ? 'gold' : 'blue'; return `<span class="act-badge" style="border-color:var(--${col});color:var(--${col})">${esc(a || '')}</span>${c ? `<span class="cost-badge">${esc(c)}</span>` : ''}`; }
    function renderSkCard(sk, extraClass = '') { if (!sk) return ''; const isLB = sk.lb; const isUlt = extraClass.includes('ult'); const isEsp = extraClass.includes('esp'); const nameColor = isLB || isUlt ? 'var(--gold)' : isEsp ? 'var(--purp)' : 'var(--txt)'; const extras = []; if (sk.hpB) extras.push('<span style="font-family:Share Tech Mono,monospace;font-size:12px;color:var(--green);margin-left:5px">★HP</span>'); if (sk.caB) extras.push('<span style="font-family:Share Tech Mono,monospace;font-size:12px;color:var(--blue);margin-left:5px">★CA</span>'); if (sk.movB) extras.push('<span style="font-family:Share Tech Mono,monospace;font-size:12px;color:var(--orange);margin-left:5px">★MOV</span>'); if (sk.sanB) extras.push('<span style="font-family:Share Tech Mono,monospace;font-size:12px;color:var(--purp);margin-left:5px">★SAN</span>'); if (isLB) extras.push('<span style="font-family:Share Tech Mono,monospace;font-size:11px;color:var(--gold);margin-left:5px;opacity:.8">LIMIT BREAK</span>'); return `<div class="sk-card ${extraClass}"><div class="sk-hdr"><span class="sk-name" style="color:${nameColor}">${esc(sk.n || sk.name)}${extras.join('')}</span><div class="sk-meta">${renderAB(sk.a || sk.action, sk.c || sk.cost)}</div></div><div class="sk-desc">${esc(sk.d || sk.desc || '')}</div>${sk.lim || sk.limit ? `<div class="sk-limit">Limite: ${esc(sk.lim || sk.limit)}</div>` : ''}</div>`; }
    function renderST(txt, color = 'var(--blue)') { return `<div class="sec-title"><span class="sec-title-txt" style="color:${color}">${txt}</span><div class="sec-line" style="background:linear-gradient(90deg,${color}40,transparent)"></div></div>`; }
    function renderBar(label, cur, max, cls) { const cc = cls === 'hp' ? 'var(--red)' : cls === 'sta' ? '#3b82f6' : 'var(--purp)'; return `<div class="bar-wrap"><div class="bar-hdr"><span class="bar-lbl">${label}</span><span class="bar-vals" style="color:${cc}">${cur}/${max}</span></div><div class="bar-track"><div class="bar-fill bar-${cls}" style="width:${pct(cur, max)}%"></div></div></div>`; }

    // ================================================================
    // TABS
    // ================================================================
    function renderStatus() {
      const n = npc(); if (!n) return '';
      const calc = calcFromHistory(n);
      const { hp, sta, san, ca, mov, init, corpoPicks, mentePicks, almaPicks, curCorpo, curMente, curAlma } = calc;
      const nat = NATURE_DATA[n.natureza];
      const attrBlocks = [
        { attr: 'corpo', picks: corpoPicks, subs: ['forca', 'vigor', 'agilidade'], col: 'blue', val: curCorpo },
        { attr: 'mente', picks: mentePicks, subs: ['habilidade', 'sincronia', 'intelecto'], col: 'purp', val: curMente },
        { attr: 'alma', picks: almaPicks, subs: ['conexao', 'entendimento'], col: 'gold', val: curAlma, locked: curCorpo < 7 || curMente < 7 }
      ].map(({ attr, picks, subs, col, val, locked }) => { const b = valueBonus(val); const cnts = {}; subs.forEach(s => cnts[s] = picks.filter(p => p === s).length); return `<div class="panel" style="opacity:${locked ? .5 : 1}"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-family:'Orbitron',monospace;font-size:15px;color:var(--${col});letter-spacing:2px">${attr.toUpperCase()}</span><div><span style="font-family:'Orbitron',monospace;font-size:22px;font-weight:700;color:var(--${col})">${val}</span><span style="font-family:'Share Tech Mono',monospace;font-size:14px;color:var(--dim);margin-left:6px">${(b >= 0 ? '+' : '') + b}</span></div></div>${subs.map(s => `<div class="calc-row"><span class="calc-key">${SUB_LBL[s]}</span><span class="calc-val" style="color:var(--${col})">${cnts[s] || 0} picks · ${bon(cnts[s] || 0)}</span></div>`).join('')}${locked ? `<div style="font-family:'Share Tech Mono',monospace;font-size:12px;color:rgba(245,158,11,0.4);margin-top:4px">Req. Corpo 7 e Mente 7</div>` : ''}</div>`; });
      const hpBrkd = hp.brkd.map(b => `<div class="calc-row"><span class="calc-key">${esc(b.k)}</span><span class="calc-val" style="color:var(--blue)">${b.v > 0 ? '+' : ''}${b.v}${b.note ? ` <span style="color:var(--dim);font-size:12px">(${esc(b.note)})</span>` : ''}</span></div>`).join('');
      const staBrkd = sta.brkd.map(b => `<div class="calc-row"><span class="calc-key">${esc(b.k)}</span><span class="calc-val" style="color:#3b82f6">${b.v > 0 ? '+' : ''}${b.v}${b.note ? ` <span style="color:var(--dim);font-size:12px">(${esc(b.note)})</span>` : ''}</span></div>`).join('');
      return `${renderST('STATUS VITAIS')}<div class="g2" style="margin-bottom:10px"><div class="panel">${renderBar('PONTOS DE VIDA', n.hpCur || 0, hp.total, 'hp')}<div class="brkd-panel" style="margin-top:7px">${hpBrkd}<div class="calc-total"><span class="calc-key" style="color:var(--lbl)">TOTAL HP MÁX</span><span class="calc-val" style="color:var(--red);font-size:19px">${hp.total}</span></div></div></div><div><div class="panel" style="margin-bottom:8px">${renderBar('STAMINA', n.staCur || 0, sta.total, 'sta')}<div class="brkd-panel" style="margin-top:6px">${staBrkd}<div class="calc-total"><span class="calc-key" style="color:var(--lbl)">TOTAL STA MÁX</span><span class="calc-val" style="color:#3b82f6;font-size:19px">${sta.total}</span></div></div>${nat ? `<div style="font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--dim);margin-top:4px">Rec: ${nat.staRec}</div>` : ''}</div><div class="panel">${renderBar('SANIDADE', n.sanCur || 0, san.max, 'san')}${san.hasClareza ? `<div style="font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--purp);margin-top:3px">Clareza Mental: base 100 + ${san.bonus} (níveis após desbloqueio)</div>` : ''}</div></div></div>${renderST('ATRIBUTOS DE COMBATE')}<div class="g4" style="margin-bottom:12px"><div class="stat-box"><div class="stat-lbl">CLASSE DE ARMADURA</div><div class="stat-val" style="color:var(--blue)">${ca.total}</div><div class="stat-note">${ca.parts.map(p => `${p.k}:${p.v}`).join(' ')}</div></div><div class="stat-box"><div class="stat-lbl">INICIATIVA</div><div class="stat-val" style="color:var(--purp)">${init >= 0 ? '+' : ''}${init}</div><div class="stat-note">Bônus de Mente</div></div><div class="stat-box"><div class="stat-lbl">MOVIMENTO (m)</div><div class="stat-val" style="color:var(--orange)">${mov}</div><div class="stat-note">${mov > 8 ? `+${mov - 8}m Passo Ágil` : 'Base'}</div></div><div class="stat-box"><div class="stat-lbl">REDUÇÃO DE DANO</div><div class="stat-val" style="color:var(--green)">${n.reducao || 0}</div></div></div><div class="g3" style="margin-bottom:12px">${attrBlocks.join('')}</div>${renderST('DADOS DE COMBATE')}<div class="g4" style="margin-bottom:12px"><div class="stat-box"><div class="stat-lbl">DANO FÍSICO</div><div class="stat-val" style="font-size:19px;color:var(--gold)">${esc(n.danoFisico || '1d6+Corpo')}</div></div><div class="stat-box"><div class="stat-lbl">MARGEM CRÍTICO</div><div class="stat-val" style="color:var(--red)">${n.critMargin || 20}+</div></div><div class="stat-box"><div class="stat-lbl">MULT. CRÍTICO</div><div class="stat-val" style="color:var(--gold)">${esc(n.critMult || '2×')}</div></div><div class="stat-box"><div class="stat-lbl">REDUÇÃO DE DANO</div><div class="stat-val" style="color:var(--green)">${n.reducao || 0}</div></div></div>${nat ? `${renderST('NATUREZA — ' + n.natureza.toUpperCase(), 'var(--purp)')}<div class="g2" style="margin-bottom:8px"><div class="panel" style="border-color:rgba(16,185,129,0.2);background:rgba(16,185,129,0.03)"><div style="font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--green);margin-bottom:3px">BUFF</div><div style="font-size:14px;color:var(--dim)">${esc(nat.buff)}</div></div><div class="panel" style="border-color:rgba(239,68,68,0.2);background:rgba(239,68,68,0.03)"><div style="font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--red);margin-bottom:3px">DEBUFF</div><div style="font-size:14px;color:var(--dim)">${esc(nat.debuff)}</div></div></div>` : ''}${renderST('STATUS ATIVOS', 'var(--red)')}<div style="margin-bottom:5px"><div style="font-family:'Share Tech Mono',monospace;font-size:12px;color:rgba(239,68,68,0.4);margin-bottom:5px">NEGATIVOS</div><div>${STATUS_NEG.map(s => `<button class="chip ${(n.statusNeg || {})[s] ? 'neg-on' : ''}" onclick="toggleStatus('neg','${s}')">${esc(s)}</button>`).join('')}</div></div><div><div style="font-family:'Share Tech Mono',monospace;font-size:12px;color:rgba(16,185,129,0.4);margin-bottom:5px;margin-top:8px">POSITIVOS</div><div>${STATUS_POS.map(s => `<button class="chip ${(n.statusPos || {})[s] ? 'pos-on' : ''}" onclick="toggleStatus('pos','${s}')">${esc(s)}</button>`).join('')}</div></div>`;
    }

    function renderHabilidades() {
      const n = npc(); if (!n) return '';
      const calc = calcFromHistory(n);
      const { corpoPicks, mentePicks, almaPicks, geralSkSet, espSkSet, crossPicks } = calc;
      let html = '';
      const nat = NATURE_DATA[n.natureza];
      const geralD = CL[n.classeGeral], espD = CL[n.classeEsp];

      if (nat) { html += renderST('HABILIDADE ÚNICA — ' + n.natureza.toUpperCase(), 'var(--purp)'); html += renderSkCard(nat.habUnica); }

      // Skills de subatributo
      const allAttrPicks = [
        ...corpoPicks.map((sub, i) => ({ attr: 'corpo', idx: i, sub })),
        ...mentePicks.map((sub, i) => ({ attr: 'mente', idx: i, sub })),
        ...almaPicks.map((sub, i) => ({ attr: 'alma', idx: i, sub }))
      ].filter(p => p.sub);

      if (allAttrPicks.length > 0) {
        html += renderST('HABILIDADES DE SUBATRIBUTO');
        ['corpo', 'mente', 'alma'].forEach(attr => {
          const picks = allAttrPicks.filter(p => p.attr === attr); if (!picks.length) return;
          const colMap = { corpo: 'var(--blue)', mente: 'var(--purp)', alma: 'var(--gold)' };
          const col = colMap[attr];
          html += `<div style="margin-bottom:12px"><div style="font-family:'Orbitron',monospace;font-size:13px;color:${col};letter-spacing:2px;margin-bottom:6px;display:flex;align-items:center;gap:8px">${attr.toUpperCase()}<div style="flex:1;height:1px;background:linear-gradient(90deg,${col}35,transparent)"></div></div>`;
          picks.forEach(({ idx, sub }) => {
            const skMap = attr === 'alma' ? SA_ALMA : SA;
            const sk = (skMap[sub] || [])[idx]; if (!sk) return;
            const isLB = idx >= 7;
            html += `<div style="display:flex;gap:8px;margin-bottom:6px;align-items:flex-start"><div style="flex-shrink:0;width:52px;padding-top:7px"><div style="font-family:'Share Tech Mono',monospace;font-size:12px;color:${col}70">NV.${idx + 1}${isLB ? ' LB' : ''}</div><div style="font-family:'Orbitron',monospace;font-size:12px;color:${col};margin-top:1px">${esc(SUB_LBL[sub])}</div></div><div style="flex:1">${renderSkCard({ ...sk, lb: isLB || sk.lb })}</div></div>`;
          });
          html += `</div>`;
        });
      }

      if (geralD) {
        html += renderST('CLASSE GERAL — ' + n.classeGeral.toUpperCase(), 'var(--blue)');
        let any = false;
        geralD.sk.forEach((sk, i) => { if (!geralSkSet.has(i)) return; html += renderSkCard(sk); any = true; });
        if (geralSkSet.has(5)) { html += `<div style="font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--gold);margin:6px 0 3px">ULTIMATE — ${esc(geralD.ult.lim || '')}</div>`; html += renderSkCard(geralD.ult, 'ult'); any = true; }
        if (!any) html += `<div class="info-note">Nenhuma skill selecionada — configure no histórico de níveis.</div>`;
      }
      if (espD) {
        html += renderST('CLASSE ESPECÍFICA — ' + n.classeEsp.toUpperCase(), 'var(--purp)');
        let any = false;
        espD.sk.forEach((sk, i) => { if (!espSkSet.has(i)) return; html += renderSkCard(sk, 'esp'); any = true; });
        if (espSkSet.has(5)) { html += `<div style="font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--gold);margin:6px 0 3px">ULTIMATE — ${esc(espD.ult.lim || '')}</div>`; html += renderSkCard(espD.ult, 'ult esp'); any = true; }
        if (!any) html += `<div class="info-note">Nenhuma skill selecionada — configure no histórico de níveis.</div>`;
      }

      if ((crossPicks || []).length) {
        html += renderST('SKILLS DE OUTRAS CLASSES (NV. 5 / 15)', 'var(--gold)');
        crossPicks.forEach(cp => { const cd = CL[cp.klass]; const sk = cd && cd.sk[cp.idx]; if (sk) html += renderSkCard({ ...sk, n: `[${cp.klass}] ${sk.n}` }, 'lb'); });
      }

      (n.titles || []).filter(t => t.name).forEach(t => { html += renderST(`TÍTULO — ${t.name.toUpperCase()} [RANK ${t.rank || 'C'}]`, 'var(--gold)'); (t.skills || []).filter(sk => sk.name).forEach(sk => { html += renderSkCard({ n: sk.name, a: sk.action, c: sk.cost, d: sk.desc }, 'ult'); }); });
      const customs = (n.customs || []).filter(a => a.name); if (customs.length) { html += renderST('HABILIDADES PERSONALIZADAS', 'var(--orange)'); customs.forEach(ab => { html += renderSkCard({ n: ab.name, a: ab.action, c: ab.cost, d: ab.desc }); }); }
      if (!nat && !geralD && !espD && allAttrPicks.length === 0 && !(n.titles || []).filter(t => t.name).length && !customs.length) html += `<div style="text-align:center;padding:40px 20px;font-family:'Share Tech Mono',monospace;font-size:14px;color:var(--dim)">Nenhuma habilidade configurada. Configure o histórico de níveis.</div>`;
      return html;
    }

    // ── Helper: renders a fixed-grid of sub-attribute option cards ──
    function renderSubOpts(attrKey, subList, currentPick, pickIdx, clickPrefix, clickSuffix) {
      // clickPrefix/clickSuffix: the onclick will be `${clickPrefix}${sub}${clickSuffix}`
      const colMap = { corpo: 'blue', mente: 'purp', alma: 'gold' };
      const col = colMap[attrKey] || 'blue';
      const skMap = attrKey === 'alma' ? SA_ALMA : SA;
      let h = `<div class="sub-opt-grid" style="grid-template-columns:repeat(${subList.length},1fr)">`;
      subList.forEach(sub => {
        const sk = skMap[sub]?.[pickIdx];
        const isSel = currentPick === sub;
        const onclick = `${clickPrefix}${sub}${clickSuffix}`;
        h += `<div class="sub-opt sub-opt-${col} ${isSel ? 'sel-' + col : ''}" onclick="${onclick}">
      <div class="sub-opt-name">${esc(SUB_LBL[sub] || sub)}</div>
      <div class="sub-opt-sk">${sk ? esc(sk.n) : '<span style="opacity:.35">—</span>'}</div>
    </div>`;
      });
      h += `</div>`;
      return h;
    }

    function saveWithFeedback() {
      save();
      const btn = document.getElementById('mainSaveBtn');
      if (!btn) return;
      btn.textContent = '✓ SALVO';
      btn.classList.add('saved');
      setTimeout(() => { btn.textContent = '[ SALVAR ]'; btn.classList.remove('saved'); }, 2200);
    }

    function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
    function clsSkRow(sk, isSel, col, onclick, isUlt) {
      return `<div class="cls-sk ${isSel ? 'sel-' + col : ''}" onclick="${onclick}"><div class="chk ${isSel ? 'on-' + col : ''}">${isSel ? '<span class="chk-tick">✓</span>' : ''}</div><div style="flex:1"><div style="font-weight:700;font-size:16px;margin-bottom:2px">${isUlt ? '★ ' : ''}${esc(sk.n)}</div><div style="font-size:14px;color:var(--dim)">${esc((sk.d || '').substring(0, 90))}${(sk.d || '').length > 90 ? '...' : ''}</div></div></div>`;
    }
    function emptyClsNote() { return `<div style="font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--dim)">Todas as skills já desbloqueadas.</div>`; }

    function renderNiveis() {
      const n = npc(); if (!n) return '';
      const lv = n.level || 0;
      const D = deriveProgression(n);
      const geralD = CL[n.classeGeral];
      const espD = CL[n.classeEsp];
      const GERAL_LEVELS = [1, 3, 6, 9, 12];
      const CROSS_LEVELS = [5, 15];

      let html = `<div class="info-note">1 ponto de atributo por nível (→ 1 skill de subatributo). Classe GERAL: skills nos níveis 1, 3, 6, 9 e 12 (ultimate a partir do 15). Classe ESPECÍFICA: a partir do nível 9. Níveis 5 e 15: 1 skill de OUTRA classe (específicas só da sua Natureza). Limit break (atributo 8/9/10): custa 2 pontos por nível, dá +1 no bônus cada, e trava os outros SUBATRIBUTOS do mesmo Atributo principal (Força/Vigor/Agilidade dentro de Corpo, etc.). Mente e Alma permanecem livres. Skills com ★HP/★CA/★MOV/★SAN entram nos cálculos automaticamente.</div>`;

      // ── NÍVEL 0 ──
      const lv0 = n.lv0 || { corpo: 0, mente: 0, alma: 0, corpoPick: null, mentePick: null, almaPick: null };
      const l0up = lv0Up(lv0);
      const isLv0Open = openLvIdx === 'lv0';
      const lv0Parts = [];
      if (l0up) { const pk = lv0[l0up + 'Pick']; lv0Parts.push(`${cap(l0up)} 0→1${pk ? ' (' + SUB_LBL[pk] + ')' : ' ⚠pick'}`); } else lv0Parts.push('Nenhum ponto distribuído');
      const lv0Warn = !l0up ? '<span class="req-warn">⚠ ponto não distribuído</span>' : (!lv0[l0up + 'Pick'] ? '<span class="req-warn">⚠ subatributo</span>' : '<span class="req-ok">✓</span>');

      html += `<div class="lv-entry" style="border-color:rgba(0,212,255,0.3)"><div class="lv-hdr ${isLv0Open ? 'active' : ''}" onclick="toggleLvEntry('lv0')">
    <span class="lv-num" style="color:var(--green)">NV.0</span>
    <span class="lv-sum">${lv0Parts.join(' · ')}</span>
    ${lv0Warn}
    <span style="font-family:'Share Tech Mono',monospace;font-size:14px;color:var(--dim);margin-left:4px">${isLv0Open ? '▲' : '▼'}</span>
  </div>
  <div class="lv-body ${isLv0Open ? 'open' : ''}">
    <div class="lv-section"><div class="lv-section-title">PONTO DE ATRIBUTO INICIAL (1 ponto)</div>
    <div class="attr-pick-row">
      <button class="attr-btn ${l0up === 'corpo' ? 'sel' : ''}" onclick="setLv0Up('corpo')">▲ Corpo +1</button>
      <button class="attr-btn attr-btn-mente ${l0up === 'mente' ? 'sel-mente sel' : ''}" onclick="setLv0Up('mente')">▲ Mente +1</button>
      <button class="attr-btn ${!l0up ? 'sel' : ''}" onclick="setLv0Up(null)">— nenhum</button>
      <span style="font-family:'Share Tech Mono',monospace;font-size:12px;color:rgba(245,158,11,0.4)">(Alma requer Corpo 7 e Mente 7)</span>
    </div>
    ${l0up === 'corpo' ? `<div class="lv-section" style="margin-top:6px"><div class="lv-section-title">SUBATRIBUTO DE CORPO (nível 1)</div>${renderSubOpts('corpo', ['forca', 'vigor', 'agilidade'], lv0.corpoPick, 0, "suLv0('corpoPick','", "')")}${lv0.corpoPick && SA[lv0.corpoPick]?.[0] ? renderSkCard({ ...SA[lv0.corpoPick][0] }) : ''}</div>` : ''}
    ${l0up === 'mente' ? `<div class="lv-section" style="margin-top:6px"><div class="lv-section-title">SUBATRIBUTO DE MENTE (nível 1)</div>${renderSubOpts('mente', ['habilidade', 'sincronia', 'intelecto'], lv0.mentePick, 0, "suLv0('mentePick','", "')")}${lv0.mentePick && SA[lv0.mentePick]?.[0] ? renderSkCard({ ...SA[lv0.mentePick][0] }) : ''}</div>` : ''}
    </div>
  </div></div>`;

      for (let i = 0; i < lv; i++) {
        const lvNum = i + 1;
        const L = D.levels[i];
        const e = L.e;
        const before = L.before;            // {corpo,mente,alma,pts}
        const ptsB = before.pts;
        const isOpen = openLvIdx === i;
        const val = validateLevel(n, lvNum);
        const statusIcon = val.ok ? '<span class="req-ok">✓</span>' : val.warnings.length ? '<span class="req-warn">⚠</span>' : '';

        // Sumário
        const parts = [];
        if (L.up) {
          const pv = pointsToValue(ptsB[L.up]), nv = pointsToValue(ptsB[L.up] + 1);
          if (nv > pv) { const pk = e[L.up + 'Pick']; parts.push(`${cap(L.up)} ${pv}→${nv}${pk ? ' (' + SUB_LBL[pk] + ')' : ' ⚠pick'}`); }
          else parts.push(`${cap(L.up)} LB ${pv} (ponto 1/2)`);
        }
        if (e.classeGeralSkIdx != null) { const sk = e.classeGeralSkIdx === 5 ? geralD?.ult : geralD?.sk[e.classeGeralSkIdx]; if (sk) parts.push(`CG: ${sk.n}`); }
        if (e.classeEspSkIdx != null) { const sk = e.classeEspSkIdx === 5 ? espD?.ult : espD?.sk[e.classeEspSkIdx]; if (sk) parts.push(`CE: ${sk.n}`); }
        if (e.crossClass && e.crossIdx != null) { const sk = CL[e.crossClass]?.sk[e.crossIdx]; if (sk) parts.push(`✦ ${sk.n}`); }
        if (!parts.length) parts.push('Nenhum ponto distribuído');

        html += `<div class="lv-entry"><div class="lv-hdr ${isOpen ? 'active' : ''}" onclick="toggleLvEntry(${i})">
      <span class="lv-num">NV.${lvNum}</span>
      <span class="lv-sum">${parts.join(' · ')}</span>
      ${statusIcon}${val.warnings.length ? `<span class="lv-warn">${val.warnings.length} aviso${val.warnings.length > 1 ? 's' : ''}</span>` : ''}
      <span style="font-family:'Share Tech Mono',monospace;font-size:14px;color:var(--dim);margin-left:4px">${isOpen ? '▲' : '▼'}</span>
    </div>
    <div class="lv-body ${isOpen ? 'open' : ''}">`;

        if (isOpen) {
          if (val.warnings.length) { html += `<div style="margin-bottom:8px">${val.warnings.map(w => `<div style="font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--gold);margin-bottom:2px">⚠ ${esc(w)}</div>`).join('')}</div>`; }

          // ── ATRIBUTO (modelo de pontos + limit break) ──
          const almaUnlocked = before.corpo >= 7 && before.mente >= 7;
          // LB só existe dentro do mesmo atributo principal — outros atributos permanecem livres
          const lbNote = ['corpo', 'mente', 'alma'].filter(a => (ptsB[a] || 0) > 7).map(a => `${cap(a)} LB`).join(', ');
          html += `<div class="lv-section"><div class="lv-section-title">DISTRIBUIÇÃO DE ATRIBUTO (1 ponto)</div>`;
          html += `<div style="font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--dim);margin-bottom:6px">Antes: Corpo ${before.corpo} · Mente ${before.mente} · Alma ${before.alma}${lbNote ? ` · 🔒 ${lbNote}` : ''}</div>`;
          html += `<div class="attr-pick-row">`;
          ['corpo', 'mente', 'alma'].forEach(a => {
            const selCls = a === 'mente' ? 'sel-mente sel' : a === 'alma' ? 'sel-alma sel' : 'sel';
            const pv = pointsToValue(ptsB[a] || 0), nv = pointsToValue((ptsB[a] || 0) + 1);
            let reason = '';
            if (a === 'alma' && !almaUnlocked) reason = 'req. C7/M7';
            else if (pv >= 10) reason = 'máx 10';
            const label = nv > pv ? `▲ ${cap(a)} ${pv}→${nv}` : `▲ ${cap(a)} LB ${pv} (1/2)`;
            if (reason) { html += `<button class="attr-btn" style="opacity:.3;cursor:not-allowed" disabled>${cap(a)} <span style="font-size:11px">(${reason})</span></button>`; }
            else { html += `<button class="attr-btn ${L.up === a ? selCls : ''}" onclick="setLvUp(${i},'${a}')">${label}</button>`; }
          });
          html += `<button class="attr-btn ${!L.up ? 'sel' : ''}" onclick="setLvUp(${i},null)">— nenhum</button>`;
          html += `</div>`;

          // ── Sub-pick (só quando um nível de atributo é efetivamente ganho) ──
          if (L.up) {
            const a = L.up; const pv = pointsToValue(ptsB[a] || 0), nv = pointsToValue((ptsB[a] || 0) + 1);
            if (nv > pv) {
              const allSubs = a === 'corpo' ? ['forca', 'vigor', 'agilidade'] : a === 'mente' ? ['habilidade', 'sincronia', 'intelecto'] : ['conexao', 'entendimento'];
              const bPicks = L.beforePicks[a];
              const pickIdx = bPicks.length;
              const pool = a === 'alma' ? SA_ALMA : SA;
              // Limit break: a partir do 2º pick LB (pickIdx>7), só o subatributo escolhido no 1º LB é válido
              const lbLocked = pickIdx > 7 ? bPicks[7] : null;
              const subs = lbLocked ? [lbLocked] : allSubs;
              const isLB = nv > 7;
              html += `<div class="lv-section" style="margin-top:6px"><div class="lv-section-title">SUBATRIBUTO DE ${a.toUpperCase()} (nível ${nv}${isLB ? ' — LIMIT BREAK' : ''})</div>`;
              if (lbLocked) html += `<div style="font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--gold);margin-bottom:4px">🔒 LB: deve continuar ${SUB_LBL[lbLocked] || lbLocked}</div>`;
              html += renderSubOpts(a, subs, e[a + 'Pick'], pickIdx, `suLv(${i},'${a}Pick','`, "')");
              if (e[a + 'Pick'] && pool[e[a + 'Pick']]?.[pickIdx]) html += renderSkCard({ ...pool[e[a + 'Pick']][pickIdx], lb: pickIdx >= 7 });
              html += `</div>`;
            }
          }

          // ── CLASSE GERAL (níveis 1,3,6,9,12; ultimate a partir do 15) ──
          if (n.classeGeral && geralD && (GERAL_LEVELS.includes(lvNum) || lvNum >= 15)) {
            html += `<div class="lv-section" style="margin-top:8px"><div class="lv-section-title">SKILL DE CLASSE GERAL (NV.${lvNum})</div>`;
            const canUlt = L.beforeGeral.size >= 5;
            const opts = canUlt ? [{ idx: 5, sk: geralD.ult }] : geralD.sk.map((sk, k) => ({ idx: k, sk })).filter(x => !L.beforeGeral.has(x.idx));
            opts.forEach(({ idx, sk }) => { const isSel = e.classeGeralSkIdx === idx; html += clsSkRow(sk, isSel, 'blue', `suLv(${i},'classeGeralSkIdx',${isSel ? 'null' : idx})`, idx === 5); });
            if (!opts.length) html += emptyClsNote();
            html += `</div>`;
          }

          // ── SEGUNDA CLASSE (a partir do nível 9, a cada 3 níveis) ──

            const canUlt = L.beforeEsp.size >= 5;
            const opts = canUlt ? [{ idx: 5, sk: espD.ult }] : espD.sk.map((sk, k) => ({ idx: k, sk })).filter(x => !L.beforeEsp.has(x.idx));
            opts.forEach(({ idx, sk }) => { const isSel = e.classeEspSkIdx === idx; html += clsSkRow(sk, isSel, 'purp', `suLv(${i},'classeEspSkIdx',${isSel ? 'null' : idx})`, idx === 5); });
            if (!opts.length) html += emptyClsNote();
            html += `</div>`;
          }

          // ── SKILL DE OUTRA CLASSE (níveis 5 e 15) ──
          if (CROSS_LEVELS.includes(lvNum)) {
            const crossPool = [...CL_GERAL.filter(c => c !== n.classeGeral && c !== n.classeEsp), ...((CL_ESP_BY_NAT[n.natureza] || []).filter(c => c !== n.classeEsp))];
            html += `<div class="lv-section" style="margin-top:8px"><div class="lv-section-title" style="color:var(--gold)">SKILL DE OUTRA CLASSE (NV.${lvNum})</div>`;
            html += `<div style="font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--dim);margin-bottom:5px">1 skill de uma classe diferente das suas (específicas só da sua Natureza)</div>`;
            html += `<select class="sel" style="margin-bottom:6px" onchange="setLvCross(${i},this.value)"><option value="">— Selecionar classe —</option>${crossPool.map(c => `<option value="${esc(c)}" ${e.crossClass === c ? 'selected' : ''}>${esc(c)}${CL[c] && CL[c].tipo === 'e' ? ' (esp)' : ''}</option>`).join('')}</select>`;
            if (e.crossClass && CL[e.crossClass]) {
              CL[e.crossClass].sk.forEach((sk, k) => { const isSel = e.crossIdx === k; html += clsSkRow(sk, isSel, 'gold', `suLv(${i},'crossIdx',${isSel ? 'null' : k})`, false); });
            }
            html += `</div>`;
          }
        }

        html += `</div></div>`;
      }
      return html;
    }

    function renderClasses() {

    <div><label class="lbl">REDUÇÃO DE DANO</label><input class="inp" type="number" value="${n.reducao || 0}" oninput="su('reducao',+this.value||0)"></div>
  </div>`;

      html += `${renderST('STATUS (CLIQUE PARA ATIVAR/DESATIVAR)', 'var(--red)')}<div style="margin-bottom:5px"><div style="font-family:'Share Tech Mono',monospace;font-size:12px;color:rgba(239,68,68,0.4);margin-bottom:5px">NEGATIVOS</div><div style="margin-bottom:10px">${STATUS_NEG.map(s => `<button class="chip ${(n.statusNeg || {})[s] ? 'neg-on' : ''}" onclick="toggleStatus('neg','${s}')">${esc(s)}</button>`).join('')}</div><div style="font-family:'Share Tech Mono',monospace;font-size:12px;color:rgba(16,185,129,0.4);margin-bottom:5px">POSITIVOS</div><div>${STATUS_POS.map(s => `<button class="chip ${(n.statusPos || {})[s] ? 'pos-on' : ''}" onclick="toggleStatus('pos','${s}')">${esc(s)}</button>`).join('')}</div></div>`;

      html += renderST('HABILIDADES PERSONALIZADAS', 'var(--orange)');
      (n.customs || []).forEach((ab, i) => { html += `<div class="panel" style="margin-bottom:6px"><div style="display:grid;grid-template-columns:1fr 90px 60px 26px;gap:6px;margin-bottom:5px"><input class="inp" style="font-size:15px" value="${esc(ab.name || '')}" placeholder="Nome da habilidade" oninput="suC(${i},'name',this.value)"><select class="sel" onchange="suC(${i},'action',this.value)" style="width:100%">${['Passiva', 'Padrão', 'Bônus', 'Movimento', 'Reação', 'Livre', 'Completa', 'Especial', 'Padrão+Bônus', 'Reação+Bônus'].map(a => `<option${ab.action === a ? ' selected' : ''}>${a}</option>`).join('')}</select><input class="inp" style="font-size:14px" value="${esc(ab.cost || '')}" placeholder="Custo" oninput="suC(${i},'cost',this.value)"><button class="npc-del" style="font-size:18px" onclick="remCustom(${i})">✕</button></div><textarea class="inp" style="min-height:48px;resize:vertical;width:100%;font-size:14px" placeholder="Descrição completa da habilidade..." oninput="suC(${i},'desc',this.value)">${esc(ab.desc || '')}</textarea></div>`; });
      html += `<button class="btn-dashed orange" onclick="addCustom()">+ HABILIDADE PERSONALIZADA</button>`;
      html += renderST('NOTAS DO MESTRE');
      html += `<textarea class="inp" style="min-height:110px;resize:vertical;width:100%;line-height:1.7" placeholder="Informações secretas, motivações, lore..." oninput="su('notes',this.value)">${esc(n.notes || '')}</textarea>`;
      return html;
    }

    // ================================================================
    // FULL RENDER
    // ================================================================
    function render() {
      const n = npc();
      const calc = n ? calcFromHistory(n) : null;
      const hp = calc?.hp, sta = calc?.sta, ca = calc?.ca, init = calc?.init ?? 0;
      const sidebarItems = npcs.map(np => {
        const c2 = calcFromHistory(np);
        const h = c2.hp; const p = pct(np.hpCur || 0, h.total);
        const bc = p > 50 ? '#10b981' : p > 25 ? '#f59e0b' : '#ef4444';
        return `<div class="npc-item ${np.id === selId ? 'active' : ''}" onclick="selectNPC('${np.id}')"><div class="npc-item-top"><span class="npc-name">${esc(np.name) || 'Sem Nome'}</span><button class="npc-del" onclick="event.stopPropagation();deleteNPC('${np.id}')">✕</button></div><div class="npc-badges">${np.natureza ? `<span class="badge badge-purp">${esc(np.natureza)}</span>` : ''}<span class="badge badge-blue">NV.${np.level || 0}</span><span class="badge badge-gold">${np.rank || 'C'}</span></div><div class="hp-bar-wrap"><div class="hp-bar-fill" style="width:${p}%;background:${bc}"></div></div><div class="hp-bar-text">${np.hpCur || 0}/${h.total} HP</div></div>`;
      }).join('');

      const tabs = [{ id: 'status', lbl: 'STATUS' }, { id: 'habilidades', lbl: 'HABILIDADES' }, { id: 'niveis', lbl: 'NÍVEIS' }, { id: 'classes', lbl: 'CLASSES' }, { id: 'pericias', lbl: 'PERÍCIAS' }, { id: 'arsenal', lbl: 'ARSENAL' }, { id: 'info', lbl: 'INFO & NOTAS' }];
      let tabContent = '';
      if (n) {
        if (activeTab === 'status') tabContent = renderStatus();
        else if (activeTab === 'habilidades') tabContent = renderHabilidades();
        else if (activeTab === 'niveis') tabContent = renderNiveis();
        else if (activeTab === 'classes') tabContent = renderClasses();
        else if (activeTab === 'pericias') tabContent = renderPericias();
        else if (activeTab === 'arsenal') tabContent = renderArsenal();
        else if (activeTab === 'info') tabContent = renderInfo();
      }

      document.getElementById('app').innerHTML = `
    <div class="sidebar">
      <div class="sb-head"><div class="sb-logo">ARC V2</div><div class="sb-tag">CATÁLOGO DE NPCs</div></div>
      <div class="sb-list">${sidebarItems}</div>
      <div class="sb-add"><button class="btn-dashed red" onclick="addNPC()">+ NOVO NPC</button></div>
    </div>
    <div class="main">
      ${n ? `
        <div class="main-hdr">
          <div>
            <div class="main-name">${esc(n.name) || 'SEM NOME'}</div>
            <div class="main-meta">NV.${n.level || 0} · ${n.natureza || '—'} · ${n.classeGeral || '—'}${n.classeEsp ? ' / ' + n.classeEsp : ''} · RANK ${n.rank || 'C'}${n.role ? ' · ' + n.role : ''}${n.faccao ? ' [' + n.faccao + ']' : ''}</div>
          </div>
          <div style="display:flex;align-items:center">
            <div class="main-vitals">
              <div class="vital-item"><div class="vital-lbl">HP</div><div class="vital-val" style="color:var(--red)">${n.hpCur || 0}<span style="color:var(--dim);font-size:14px">/${hp.total}</span></div></div>
              <div class="vital-item"><div class="vital-lbl">STA</div><div class="vital-val" style="color:#3b82f6">${n.staCur || 0}<span style="color:var(--dim);font-size:14px">/${sta.total}</span></div></div>
              <div class="vital-item"><div class="vital-lbl">CA</div><div class="vital-val" style="color:var(--blue)">${ca.total}</div></div>
              <div class="vital-item"><div class="vital-lbl">INIT</div><div class="vital-val" style="color:var(--purp)">${init >= 0 ? '+' : ''}${init}</div></div>
            </div>
            ${EMBEDDED ? '' : `<button id="mainSaveBtn" class="save-npc-btn" onclick="saveWithFeedback()">[ SALVAR ]</button>`}
          </div>
        </div>
        <div class="tabs">${tabs.map(t => `<button class="tab-btn ${activeTab === t.id ? 'active' : ''}" onclick="switchTab('${t.id}')">${t.lbl}</button>`).join('')}</div>
        <div class="content">${tabContent}</div>
      `: `<div class="empty-state"><div class="empty-icon">◈</div><div class="empty-txt">NENHUM NPC SELECIONADO</div><button class="btn-dashed blue" style="margin-top:10px;width:220px" onclick="addNPC()">+ CRIAR PRIMEIRO NPC</button></div>`}
    </div>`;
    }

    // ================================================================
    // ACTIONS
    // ================================================================
    function selectNPC(id) { selId = id; activeTab = 'status'; openLvIdx = null; render(); }
    function switchTab(t) { activeTab = t; render(); }
    function addNPC() { const n = mkNPC(); npcs.push(n); selId = n.id; activeTab = 'info'; save(); render(); }
    function deleteNPC(id) { npcs = npcs.filter(n => n.id !== id); if (selId === id) selId = npcs[0]?.id || null; save(); render(); }

    function save() {
      if (EMBEDDED) { try { window.parent.postMessage({ type: 'arc-npc-save', npcs: npcs }, '*'); } catch (e) { } return; }
      try { localStorage.setItem('arc_npc_v3', JSON.stringify(npcs)); } catch (e) { }
    }
    function load() {
      if (EMBEDDED) {
        // Fonte única de verdade = GM Screen (S.catalogNpcs em arc_gm_v2). Não usa localStorage próprio.
        npcs = []; selId = null;
        window.addEventListener('message', e => {
          const d = e.data; if (!d || typeof d !== 'object' || d.type !== 'arc-npc-load') return;
          let arr = Array.isArray(d.npcs) ? d.npcs : [];
          // Migração única: se o GM ainda não tem NPCs, importa os salvos localmente (arc_npc_v3)
          if (arr.length === 0) { try { const ls = localStorage.getItem('arc_npc_v3'); if (ls) { const p = JSON.parse(ls); if (Array.isArray(p) && p.length) arr = p; } } catch (_e) { } }
          if (arr.length > 0) { npcs = arr.map(n => ({ ...mkNPC(), ...n, levelHistory: n.levelHistory || [] })); selId = npcs[0].id; save(); }
          else { npcs = []; selId = null; }
          render();
        });
        try { window.parent.postMessage({ type: 'arc-npc-ready' }, '*'); } catch (e) { }
        render(); return;
      }
      // Migrar dados do formato antigo (v2) se existir
      try {
        const old = localStorage.getItem('arc_npc_v2');
        if (old) {
          const parsed = JSON.parse(old);
          if (Array.isArray(parsed) && parsed.length > 0) {
            // Migrar: converter picks antigos para levelHistory vazio
            // (o usuário vai precisar reconfigurar, mas os dados básicos ficam)
            npcs = parsed.map(n => ({ ...mkNPC(), ...n, levelHistory: n.levelHistory || [] }));
            selId = npcs[0].id;
            render(); return;
          }
        }
      } catch (e) { }
      try {
        const d = localStorage.getItem('arc_npc_v3');
        if (d) { const p = JSON.parse(d); if (Array.isArray(p) && p.length > 0) { npcs = p; selId = p[0].id; } }
      } catch (e) { }
      render();
    }

    load();
  </script>
</body>

</html>
